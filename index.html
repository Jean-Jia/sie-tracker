<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIE · 备考追踪</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg:#f6f4f0;--surface:#ffffff;--surface2:#f0ede7;--surface3:#e8e4dd;
  --border:#e2ddd6;--border2:#cdc8be;
  --text:#1c1a16;--text2:#6b6258;--text3:#a09890;
  --green:#1a6e4a;--green-bg:#e6f4ed;--green-mid:#3daa78;--green-light:#b8dfc9;
  --red:#b83232;--red-bg:#fce8e8;--red-light:#f0b8b8;
  --amber:#8a5f00;--amber-bg:#fff3d4;--amber-light:#f0d99a;
  --blue:#1a4f8a;--blue-bg:#e6f0fb;--blue-light:#b3cff0;
  --sw:224px;
  --mono:'DM Mono','Courier New',monospace;
  --sans:'DM Sans','PingFang SC','Microsoft YaHei',sans-serif;
  --r:10px;--r-sm:6px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;}

/* ── Login ── */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:360px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.06);}
.login-logo{font-family:var(--mono);font-size:10px;color:var(--green-mid);letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px;}
.login-title{font-size:22px;font-weight:600;margin-bottom:4px;}
.login-sub{font-size:13px;color:var(--text2);margin-bottom:28px;}
.login-select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--sans);font-size:14px;background:var(--surface);color:var(--text);margin-bottom:12px;cursor:pointer;appearance:none;}
.login-select:focus{outline:none;border-color:var(--green-mid);}
.login-btn{width:100%;padding:10px;background:var(--green);color:white;border:none;border-radius:var(--r-sm);font-family:var(--sans);font-size:14px;font-weight:500;cursor:pointer;transition:background .15s;}
.login-btn:hover{background:var(--green-mid);}

/* ── App Layout ── */
#app-screen{display:flex;min-height:100vh;}
.hidden{display:none!important;}

/* ── Sidebar ── */
.sidebar{width:var(--sw);background:var(--surface);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;z-index:50;}
.sb-brand{padding:18px 16px 12px;border-bottom:1px solid var(--border);}
.sb-logo{font-family:var(--mono);font-size:9px;color:var(--green-mid);letter-spacing:.14em;text-transform:uppercase;}
.sb-title{font-size:15px;font-weight:600;margin-top:2px;}
.sb-user{margin:10px 10px 0;padding:8px 10px;background:var(--surface2);border-radius:var(--r-sm);border:1px solid var(--border);}
.sb-user-name{font-size:13px;font-weight:600;}
.sb-user-sub{font-family:var(--mono);font-size:10px;color:var(--text3);margin-top:1px;}
.exam-widget{margin:8px 10px 0;background:var(--green-bg);border:1px solid var(--green-light);border-radius:var(--r-sm);padding:8px 10px;}
.ew-label{font-family:var(--mono);font-size:9px;color:var(--green);letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px;}
.ew-days{font-family:var(--mono);font-size:30px;font-weight:500;color:var(--green);line-height:1;}
.ew-sub{font-size:10px;color:var(--green);margin-top:2px;}
.sb-nav{padding:6px 0;flex:1;}
.nav-sec{padding:10px 16px 3px;font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;}
.ni{display:flex;align-items:center;gap:8px;padding:8px 16px;cursor:pointer;transition:all .15s;border-left:2px solid transparent;}
.ni:hover{background:var(--surface2);}
.ni.active{background:#edf7f2;border-left-color:var(--green-mid);}
.ni-icon{font-size:14px;min-width:18px;}
.ni-label{font-size:12px;color:var(--text2);font-weight:500;}
.ni.active .ni-label{color:var(--text);}
.sb-logout{padding:10px 16px;border-top:1px solid var(--border);}
.logout-btn{width:100%;padding:7px;background:none;border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--sans);font-size:12px;color:var(--text2);cursor:pointer;transition:all .15s;}
.logout-btn:hover{background:var(--surface2);color:var(--text);}

/* ── Main ── */
.main{margin-left:var(--sw);flex:1;padding:32px 40px;max-width:960px;}
.view{display:none;}
.view.active{display:block;}

/* Page Header */
.page-header{margin-bottom:24px;}
.page-title{font-size:20px;font-weight:600;margin-bottom:2px;}
.page-sub{font-size:13px;color:var(--text2);}

/* Card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:20px;}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}

/* Stat Box */
.stat-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;}
.stat-label{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px;}
.stat-value{font-family:var(--mono);font-size:28px;font-weight:500;line-height:1.1;}
.stat-value.green{color:var(--green);}
.stat-value.red{color:var(--red);}
.stat-value.amber{color:var(--amber);}
.stat-unit{font-size:12px;color:var(--text2);margin-top:3px;}

/* Alert */
.alert{padding:10px 14px;border-radius:var(--r-sm);font-size:13px;margin-bottom:12px;}
.alert-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-light);}
.alert-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-light);}
.alert-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-light);}

/* Progress Bar */
.prog-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin:6px 0;}
.prog-fill{height:100%;border-radius:3px;transition:width .4s;}
.prog-fill.green{background:var(--green-mid);}
.prog-fill.red{background:var(--red);}
.prog-fill.amber{background:var(--amber);}

/* Streak Dots */
.streak-dots{display:flex;gap:3px;flex-wrap:wrap;}
.dot{width:22px;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;font-family:var(--mono);background:var(--border);color:var(--text3);}
.dot.ok{background:var(--green-bg);color:var(--green);}
.dot.today-ok{background:var(--green-mid);color:white;}
.dot.today-no{background:var(--amber-bg);color:var(--amber);}
.dot.missed{background:var(--red-bg);color:var(--red);}

/* Check-in */
.checkin-area{text-align:center;padding:20px 0;}
.checkin-btn{padding:12px 36px;background:var(--green);color:white;border:none;border-radius:var(--r);font-family:var(--sans);font-size:15px;font-weight:500;cursor:pointer;transition:background .15s;}
.checkin-btn:hover{background:var(--green-mid);}
.checkin-done-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--green-bg);border:1px solid var(--green-light);border-radius:var(--r);color:var(--green);font-size:13px;font-weight:500;}
.checkin-row{padding:11px 0;border-bottom:1px solid var(--border);}
.checkin-row:last-child{border-bottom:none;}
.checkin-row-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.checkin-date{font-family:var(--mono);font-size:11px;color:var(--text3);}
.checkin-hours{font-family:var(--mono);font-size:11px;color:var(--green);background:var(--green-bg);padding:1px 7px;border-radius:4px;}
.checkin-content{font-size:13px;color:var(--text2);line-height:1.5;}

/* Chapter Grid */
.chapter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px;}
.ch-item{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:all .15s;user-select:none;}
.ch-item:hover{border-color:var(--border2);}
.ch-item.done{background:var(--green-bg);border-color:var(--green-light);}
.ch-item input[type=checkbox]{accent-color:var(--green);width:14px;height:14px;cursor:pointer;flex-shrink:0;}
.ch-num{font-family:var(--mono);font-size:10px;color:var(--text3);font-weight:700;}
.ch-item.done .ch-num{color:var(--green-mid);}
.ch-name{font-size:12px;color:var(--text2);font-weight:500;}
.ch-item.done .ch-name{color:var(--green);}

/* Gap text */
.gap-ahead{color:var(--green);font-weight:500;}
.gap-behind{color:var(--red);font-weight:500;}
.gap-on-track{color:var(--amber);font-weight:500;}

/* Badge */
.badge{display:inline-block;padding:2px 7px;border-radius:4px;font-family:var(--mono);font-size:10px;font-weight:600;}
.badge-green{background:var(--green-bg);color:var(--green);}
.badge-red{background:var(--red-bg);color:var(--red);}
.badge-amber{background:var(--amber-bg);color:var(--amber);}

/* Admin Table */
.admin-table{width:100%;border-collapse:collapse;}
.admin-table th{font-family:var(--mono);font-size:9px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;text-align:left;border-bottom:1px solid var(--border);background:var(--surface2);}
.admin-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
.admin-table tbody tr:last-child td{border-bottom:none;}
.admin-table tbody tr{cursor:pointer;transition:background .1s;}
.admin-table tbody tr:hover td{background:var(--surface2);}
.click-hint{font-size:11px;color:var(--text3);font-style:italic;}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:center;justify-content:center;}
.modal{background:var(--surface);border-radius:14px;padding:28px;width:500px;max-width:92vw;max-height:90vh;overflow-y:auto;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:4px;}
.modal-sub{font-size:13px;color:var(--text2);margin-bottom:20px;}
.form-group{margin-bottom:16px;}
.form-label{display:block;font-size:12px;font-weight:500;color:var(--text2);margin-bottom:5px;}
.form-req{color:var(--red);}
.form-input,.form-textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:var(--r-sm);font-family:var(--sans);font-size:13px;background:var(--surface);color:var(--text);transition:border-color .15s;}
.form-input:focus,.form-textarea:focus{outline:none;border-color:var(--green-mid);}
.form-textarea{resize:vertical;min-height:90px;}
.modal-footer{display:flex;gap:8px;justify-content:flex-end;margin-top:20px;}
.btn{padding:9px 20px;border-radius:var(--r-sm);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;border:none;transition:all .15s;}
.btn-primary{background:var(--green);color:white;}
.btn-primary:hover{background:var(--green-mid);}
.btn-secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn-secondary:hover{background:var(--surface3);}

/* Webhook Settings */
.wh-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);}
.wh-row:last-child{border-bottom:none;}
.wh-name{font-size:13px;font-weight:500;min-width:130px;}
.wh-input{flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:4px;font-size:12px;font-family:var(--mono);color:var(--text2);}
.wh-input:focus{outline:none;border-color:var(--green-mid);}

/* Notification Buttons */
.notif-btn{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px;gap:12px;}
.notif-btn-title{font-size:13px;font-weight:500;}
.notif-btn-sub{font-size:11px;color:var(--text3);margin-top:1px;}
.send-btn{padding:5px 14px;background:var(--green);color:white;border:none;border-radius:4px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.send-btn:hover{background:var(--green-mid);}

/* Empty State */
.empty-state{text-align:center;padding:32px;color:var(--text3);font-size:13px;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:#1c1a16;color:white;padding:10px 16px;border-radius:var(--r-sm);font-size:13px;z-index:200;transition:opacity .3s;pointer-events:none;}
.toast.gone{opacity:0;}

/* Loading overlay */
#loading-overlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
#loading-overlay.hidden{display:none;}
.spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--green-mid);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{font-size:13px;color:var(--text3);}

/* Scrollbar */
::-webkit-scrollbar{width:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}

/* ── Knowledge Base ── */
.ch-pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
.ch-pill{padding:5px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;background:var(--surface2);}
.ch-pill.active{background:var(--green);color:white;border-color:var(--green);}
.ch-pill:hover:not(.active){border-color:var(--border2);background:var(--surface3);}
.filter-pills{display:flex;gap:6px;}
.filter-pill{padding:4px 12px;border:1px solid var(--border);border-radius:20px;font-size:12px;cursor:pointer;transition:all .15s;background:var(--surface2);}
.filter-pill.active{background:var(--green-bg);color:var(--green);border-color:var(--green-light);}
.filter-pill:hover:not(.active){border-color:var(--border2);}
.official-box{background:var(--blue-bg);border:1px solid var(--blue-light);border-radius:var(--r-sm);padding:14px 16px;}
.official-label{font-family:var(--mono);font-size:9px;color:var(--blue);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}
.official-body{font-size:13px;color:var(--text);line-height:1.7;white-space:pre-wrap;}
.note-card{padding:12px 0;border-bottom:1px solid var(--border);}
.note-card:last-of-type{border-bottom:none;}
.note-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.note-author{font-size:13px;font-weight:600;color:var(--text);}
.note-badges{display:flex;align-items:center;gap:6px;}
.note-body{font-size:13px;color:var(--text2);line-height:1.6;white-space:pre-wrap;}
.note-add-form{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.privacy-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;}
.privacy-toggle input{accent-color:var(--green);}
.section-hdr{font-size:13px;font-weight:500;margin-bottom:8px;}
.sec-count{display:inline-flex;align-items:center;justify-content:center;background:var(--surface3);color:var(--text3);border-radius:10px;font-family:var(--mono);font-size:10px;padding:1px 7px;margin-left:4px;}
</style>
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">SIE · Exam Tracker</div>
    <div class="login-title">SIE 备考追踪</div>
    <div class="login-sub">选择你的账号进入</div>
    <select class="login-select" id="login-select">
      <option value="">— 选择账号 —</option>
      <option value="jiannbinkhor">Jiannbin Khor</option>
      <option value="nicholasneoh">Nicholas Neoh</option>
      <option value="daisywang">Daisy Wang</option>
      <option value="cindylin">Cindy Lin</option>
      <option value="suqinng">Su Qin Ng</option>
      <option value="jeremyzhang">Jeremy Zhang</option>
      <option value="jeanjia">Jean Jia（管理员）</option>
    </select>
    <button class="login-btn" onclick="handleLogin()">进入</button>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="app-screen" class="hidden">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="sb-logo">SIE · Exam Tracker</div>
      <div class="sb-title">备考追踪</div>
    </div>
    <div style="padding:10px 10px 0;">
      <div class="sb-user">
        <div class="sb-user-name" id="sb-name">—</div>
        <div class="sb-user-sub" id="sb-sub">—</div>
      </div>
    </div>
    <div id="sb-exam-widget"></div>
    <nav class="sb-nav" id="sb-nav"></nav>
    <div class="sb-logout">
      <button class="logout-btn" onclick="handleLogout()">退出登录</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="view" id="view-dashboard"></div>
    <div class="view" id="view-chapters"></div>
    <div class="view" id="view-admin"></div>
    <div class="view" id="view-settings"></div>
    <div class="view" id="view-knowledge"></div>
  </main>
</div>

<!-- ═══ CHECK-IN MODAL ═══ -->
<div class="modal-overlay hidden" id="modal-checkin">
  <div class="modal">
    <div class="modal-title">今日打卡</div>
    <div class="modal-sub" id="modal-checkin-date">—</div>
    <div class="form-group">
      <label class="form-label">学习时长（小时）<span class="form-req">*</span></label>
      <input type="number" class="form-input" id="ci-hours" min="0.5" max="24" step="0.5" placeholder="例：2.5">
    </div>
    <div class="form-group">
      <label class="form-label">今天学了什么？<span class="form-req">*</span> <span style="color:var(--text3);font-weight:400;">（认真填写，防止为打卡而打卡）</span></label>
      <textarea class="form-textarea" id="ci-content" style="min-height:110px;" placeholder="请具体描述今天学习的内容，例：学习第3章 Municipal Securities，重点理解了 GO bonds vs Revenue bonds 的区别，做了20道练习题，正确率75%…"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-checkin')">取消</button>
      <button class="btn btn-primary" onclick="submitCheckin()">提交打卡 ✓</button>
    </div>
  </div>
</div>

<!-- ═══ ADMIN DETAIL MODAL ═══ -->
<div class="modal-overlay hidden" id="modal-admin-detail">
  <div class="modal" style="width:560px;">
    <div class="modal-title" id="detail-title">—</div>
    <div class="modal-sub" id="detail-sub">—</div>
    <div id="detail-body"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal('modal-admin-detail')">关闭</button>
    </div>
  </div>
</div>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="spinner"></div>
  <div class="loading-text">加载中…</div>
</div>

<!-- Toast -->
<div class="toast gone" id="toast">—</div>

<script>
// ══════════════════════════════════════════════
//  CONFIG
// ══════════════════════════════════════════════
const TRACKING_START = '2026-05-08';
const TOTAL_CHAPTERS = 20;

function localDateStr() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
const TODAY = localDateStr();

const USERS = {
  jiannbinkhor: { name:'Jiannbin Khor', startChapter:11, examDate:'2026-06-05', weeklyHours:11.5, feishuId:'jiannbinkhor', studyStart:'2026-04-06' },
  nicholasneoh: { name:'Nicholas Neoh', startChapter:1,  examDate:'2026-07-05', weeklyHours:5,    feishuId:'nicholasneoh', studyStart:'2026-04-13' },
  daisywang:    { name:'Daisy Wang',    startChapter:5,  examDate:'2026-06-25', weeklyHours:6,    feishuId:'daisywang',    studyStart:'2026-04-10' },
  cindylin:     { name:'Cindy Lin',     startChapter:0,  examDate:'2026-07-05', weeklyHours:5,    feishuId:'cindylin',     studyStart:'2026-04-06' },
  suqinng:      { name:'Su Qin Ng',     startChapter:0,  examDate:'2026-06-15', weeklyHours:9,    feishuId:'suqinng',      studyStart:'2026-04-20' },
  jeremyzhang:  { name:'Jeremy Zhang',  startChapter:0,  examDate:'2026-06-15', weeklyHours:9,    feishuId:'jeremyzhang',  studyStart:'2026-04-30' },
  jeanjia:      { name:'Jean Jia',      startChapter:0,  examDate:null,         weeklyHours:0,    feishuId:'jeanjia', isAdmin:true, studyStart:null }
};

let currentUser = null;

// ══════════════════════════════════════════════
//  SUPABASE + DATA LAYER

function initChapters(username) {
  const arr = [];
  for (let i = 1; i <= (USERS[username].startChapter||0); i++) arr.push(i);
  return arr;
}

async function loadAllData() {
  const [{ data:progData }, { data:ciData }, { data:whData }, { data:notesData }] = await Promise.all([
    sb.from('chapter_progress').select('*'),
    sb.from('checkins').select('*'),
    sb.from('webhook_config').select('*').eq('id',1).maybeSingle(),
    sb.from('chapter_notes').select('*').order('created_at', { ascending: true })
  ]);
  for (const username of Object.keys(USERS).filter(u => !USERS[u].isAdmin)) {
    const prog = progData?.find(p => p.username === username);
    const checkins = {};
    ciData?.filter(c => c.username === username).forEach(c => {
      checkins[c.date] = { hours: Number(c.hours), content: c.content, ts: c.created_at };
    });
    DB.progress[username] = {
      completedChapters: prog?.completed_chapters ?? initChapters(username),
      checkins
    };
  }
  DB.webhookConfig = {
    groupWebhook: whData?.group_webhook || '',
    userOpenIds:  whData?.user_open_ids  || {}
  };
  DB.chapterNotes = notesData || [];
}

function getProgress(username) {
  if (!DB.progress[username])
    DB.progress[username] = { completedChapters: initChapters(username), checkins:{} };
  return DB.progress[username];
}

function saveProgress(username, data) {
  DB.progress[username] = data;
  sb.from('chapter_progress').upsert({ username, completed_chapters: data.completedChapters, updated_at: new Date().toISOString() });
  const ci = data.checkins[TODAY];
  if (ci) sb.from('checkins').upsert({ username, date: TODAY, hours: ci.hours, content: ci.content }, { onConflict: 'username,date' });
}

function getWebhookConfig() { return DB.webhookConfig; }

function saveWebhookConfig(cfg) {
  DB.webhookConfig = cfg;
  sb.from('webhook_config').upsert({ id:1, group_webhook: cfg.groupWebhook, user_open_ids: cfg.userOpenIds });
}

// ══════════════════════════════════════════════
//  CALCULATIONS
// ══════════════════════════════════════════════
function daysBetween(a, b) {
  return Math.round((new Date(b+'T00:00:00') - new Date(a+'T00:00:00')) / 86400000);
}

function offsetDate(d, n) {
  const dt = new Date(d+'T00:00:00');
  dt.setDate(dt.getDate() + n);
  return dt.toISOString().slice(0,10);
}

function daysUntilExam(username) {
  const exam = USERS[username].examDate;
  return exam ? daysBetween(TODAY, exam) : null;
}

function daysElapsed() {
  return Math.max(0, daysBetween(TRACKING_START, TODAY));
}

// Chapters that should be completed by end of today (linear plan from actual study start)
function plannedChaptersToday(username) {
  const u = USERS[username];
  if (!u.examDate || !u.studyStart) return null;
  const totalDays = daysBetween(u.studyStart, u.examDate);
  if (totalDays <= 0) return TOTAL_CHAPTERS;
  const elapsed = Math.max(0, daysBetween(u.studyStart, TODAY));
  return Math.min(TOTAL_CHAPTERS, (elapsed / totalDays) * TOTAL_CHAPTERS);
}

function completedCount(username) {
  return getProgress(username).completedChapters.length;
}

function progressGap(username) {
  const planned = plannedChaptersToday(username);
  if (planned === null) return null;
  return completedCount(username) - planned; // + ahead, - behind
}

function dailyHoursTarget(username) {
  return USERS[username].weeklyHours / 7;
}

function todayCheckin(username) {
  return getProgress(username).checkins[TODAY] || null;
}

function checkinStreak(username) {
  const dates = Object.keys(getProgress(username).checkins);
  let streak = 0, cursor = TODAY;
  while (dates.includes(cursor)) { streak++; cursor = offsetDate(cursor, -1); }
  return streak;
}

function missedDays(username) {
  const dates = Object.keys(getProgress(username).checkins);
  const elapsed = daysElapsed();
  const done = dates.filter(d => d >= TRACKING_START && d <= TODAY).length;
  return Math.max(0, elapsed - done);
}

function getLast7Days() {
  return Array.from({length:7}, (_,i) => offsetDate(TODAY, i-6));
}

// ══════════════════════════════════════════════
//  FORMATTERS
// ══════════════════════════════════════════════
function fmtDate(d) {
  const dt = new Date(d+'T00:00:00');
  return `${dt.getMonth()+1}月${dt.getDate()}日`;
}

function fmtGap(gap) {
  if (gap === null) return '—';
  if (Math.abs(gap) < 0.3) return '<span class="gap-on-track">进度持平</span>';
  if (gap > 0) return `<span class="gap-ahead">领先 ${gap.toFixed(1)} 章</span>`;
  return `<span class="gap-behind">落后 ${Math.abs(gap).toFixed(1)} 章</span>`;
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function getQuote() {
  const idx = daysBetween('2026-01-01', TODAY);
  return QUOTES[((idx % QUOTES.length) + QUOTES.length) % QUOTES.length];
}

function getUserStatus(gap) {
  if (gap === null || gap >= -0.3) return { icon:'🟢', label:'On Track' };
  if (gap >= -2) return { icon:'🟡', label:'At Risk' };
  return { icon:'🔴', label:'Off Track' };
}

function consecutiveMissedDays(username) {
  const prog = getProgress(username);
  let count = 0, cursor = TODAY;
  while (!prog.checkins[cursor] && cursor >= TRACKING_START) {
    count++;
    cursor = offsetDate(cursor, -1);
    if (count > 30) break;
  }
  return count;
}

async function sendFeishu(url, payload) {
  if (!url) return false;
  try {
    await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(payload)
    });
    return true;
  } catch { return false; }
}

function buildCard(title, color, content, btnLabel, btnUrl) {
  return {
    msg_type: 'interactive',
    card: {
      config: { wide_screen_mode: true },
      header: {
        title: { tag: 'plain_text', content: title },
        template: color
      },
      elements: [
        { tag: 'div', text: { tag: 'lark_md', content } },
        {
          tag: 'action',
          actions: [{
            tag: 'button',
            text: { tag: 'plain_text', content: btnLabel },
            type: 'primary',
            url: btnUrl
          }]
        }
      ]
    }
  };
}

async function doSendDailyReminder() {
  const cfg = getWebhookConfig();
  if (!cfg.groupWebhook) { showToast('请先配置群 Webhook'); return; }
  const users = Object.keys(USERS).filter(u => !USERS[u].isAdmin);
  const sorted = users
    .map(u => ({ u, gap:progressGap(u), actual:completedCount(u), left:daysUntilExam(u) }))
    .sort((a,b) => (b.gap||0)-(a.gap||0));
  const medals = ['🥇','🥈','🥉'];
  const lines = [
    `"${getQuote()}"`,
    '',
    `<at id=all></at> 今日学习任务来了，冲！💪`,
    '',
    '━━━━━━━━━━━━━━━',
    '🏆 进度排行榜',
    '━━━━━━━━━━━━━━━'
  ];
  sorted.forEach((s, i) => {
    const st = getUserStatus(s.gap);
    const rowIcon = st.label === 'On Track' ? (medals[i] || '🟢') : st.label === 'At Risk' ? '⚠️' : '❌';
    const gapStr = s.gap===null ? '持平' : s.gap>=0 ? `领先${s.gap.toFixed(1)}章` : `落后${Math.abs(s.gap).toFixed(1)}章`;
    lines.push(`${rowIcon} **${USERS[s.u].name}**  ${s.actual}/${TOTAL_CHAPTERS}章  ${st.icon} ${st.label} · ${gapStr} · 剩${s.left}天`);
  });
  lines.push('━━━━━━━━━━━━━━━');
  lines.push('今日目标：完成打卡 ✅');
  const card = buildCard(`📚 SIE备考提醒 · ${fmtDate(TODAY)}`, 'blue', lines.join('\n'), '📎 打开备考工具 →', SITE_URL);
  const ok = await sendFeishu(cfg.groupWebhook, card);
  showToast(ok ? '今日提醒已发送到群' : '发送失败，请检查 Webhook');
}

async function doSendWeeklyReport() {
  const cfg = getWebhookConfig();
  if (!cfg.groupWebhook) { showToast('请先配置群 Webhook'); return; }
  const users = Object.keys(USERS).filter(u => !USERS[u].isAdmin);
  const sorted = users
    .map(u => ({ u, gap:progressGap(u), actual:completedCount(u), left:daysUntilExam(u) }))
    .sort((a,b) => (b.gap||0)-(a.gap||0));
  const onTrack  = sorted.filter(s => getUserStatus(s.gap).label === 'On Track');
  const atRisk   = sorted.filter(s => getUserStatus(s.gap).label === 'At Risk');
  const offTrack = sorted.filter(s => getUserStatus(s.gap).label === 'Off Track');
  const medals = ['🥇','🥈','🥉'];
  const renderRow = (s, icon) => {
    const gapStr = s.gap===null ? '持平' : s.gap>=0 ? `领先${s.gap.toFixed(1)}章` : `落后${Math.abs(s.gap).toFixed(1)}章`;
    return `${icon} **${USERS[s.u].name}** · ${s.actual}/${TOTAL_CHAPTERS}章 · ${gapStr} · 剩${s.left}天`;
  };
  const lines = [`"${getQuote()}"`, ''];
  if (onTrack.length) {
    lines.push('🟢 **On Track**');
    onTrack.forEach((s,i) => lines.push(renderRow(s, medals[i]||'🟢')));
    lines.push('');
  }
  if (atRisk.length) {
    lines.push('🟡 **At Risk**');
    atRisk.forEach(s => lines.push(renderRow(s, '⚠️')));
    lines.push('');
  }
  if (offTrack.length) {
    lines.push('🔴 **Off Track**');
    offTrack.forEach(s => lines.push(renderRow(s, '❌')));
    lines.push('');
  }
  if (atRisk.length || offTrack.length) lines.push('💡 落后的同学加油，考试不等人！');
  const card = buildCard(`📊 SIE考牌项目 · 本周进度播报 · ${fmtDate(TODAY)}`, 'green', lines.join('\n'), '📎 打开备考工具 →', SITE_URL);
  const ok = await sendFeishu(cfg.groupWebhook, card);
  showToast(ok ? '周报已发送到群' : '发送失败，请检查 Webhook');
}

async function doSendBehindAlert() {
  const cfg = getWebhookConfig();
  if (!cfg.groupWebhook) { showToast('请先配置群 Webhook'); return; }
  const users = Object.keys(USERS).filter(u => !USERS[u].isAdmin);
  const behind = users.filter(u => consecutiveMissedDays(u) >= 3);
  if (!behind.length) { showToast('没有连续3天以上未打卡的同学'); return; }
  const blocks = behind.map(u => {
    const missedD = consecutiveMissedDays(u);
    const actual = completedCount(u);
    const gap = progressGap(u);
    const left = daysUntilExam(u);
    const gapStr = gap!==null && gap<0 ? `落后计划${Math.abs(gap).toFixed(1)}章` : '进度正常';
    return `👋 **${USERS[u].name}**，你已经连续 **${missedD}天** 没有打卡了\n` +
           `📊 当前进度：${actual}/${TOTAL_CHAPTERS}章，${gapStr}\n` +
           `⏰ 距考试还有 ${left} 天\n` +
           `现在开始还来得及，今天学一章就是进步！`;
  });
  const content = `<at id=all></at>\n\n` + blocks.join('\n\n─────────────────\n\n');
  const card = buildCard('⚠️ 备考进度催促', 'red', content, '📎 打开备考工具 →', SITE_URL);
  const ok = await sendFeishu(cfg.groupWebhook, card);
  showToast(ok ? `已提醒 ${behind.length} 位连续未打卡的同学` : '发送失败');
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('gone');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('gone'), 3200);
}

function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

function switchView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(`view-${view}`).classList.add('active');
  document.querySelectorAll('.ni').forEach(n => n.classList.remove('active'));
  document.querySelector(`.ni[data-view="${view}"]`)?.classList.add('active');
  if (view === 'dashboard') renderDashboard();
  else if (view === 'chapters') renderChapters();
  else if (view === 'admin') renderAdmin();
  else if (view === 'settings') renderSettings();
  else if (view === 'knowledge') renderKnowledge();
}

  const prog = getProgress(currentUser);
  const actual = prog.completedChapters.length;
  const planned = plannedChaptersToday(currentUser) || 0;
  const gap = progressGap(currentUser);
  const streak = checkinStreak(currentUser);
  const missed = missedDays(currentUser);
  const ci = todayCheckin(currentUser);
  const dailyH = dailyHoursTarget(currentUser);

  const pct = Math.min(100, Math.round(actual / TOTAL_CHAPTERS * 100));
  const planPct = Math.min(100, Math.round(planned / TOTAL_CHAPTERS * 100));

  // Alerts
  let alerts = '';
  if (gap !== null && gap < -2)
    alerts += `<div class="alert alert-red">⚠️ 当前落后进度约 ${Math.abs(gap).toFixed(1)} 章，需要加速学习！</div>`;
  else if (gap !== null && gap > 1)
    alerts += `<div class="alert alert-green">🎉 当前领先进度约 ${gap.toFixed(1)} 章，继续保持！</div>`;
  if (missed > 2)
    alerts += `<div class="alert alert-amber">📌 已有 ${missed} 天未打卡，请保持学习节奏。</div>`;

  // Streak dots (last 7 days)
  const dots = getLast7Days().map(d => {
    const hasCi = !!prog.checkins[d];
    const dayNum = new Date(d+'T00:00:00').getDate();
    let cls = '';
    if (d === TODAY) cls = hasCi ? 'today-ok' : 'today-no';
    else if (d < TRACKING_START) cls = '';
    else cls = hasCi ? 'ok' : 'missed';
    return `<div class="dot ${cls}" title="${d}">${dayNum}</div>`;
  }).join('');

  // Check-in section
  const ciSection = ci
    ? `<div style="text-align:center;">
         <div class="checkin-done-badge">✓ 今日已打卡 · ${ci.hours}h</div>
         <div style="margin-top:10px;padding:12px 14px;background:var(--surface2);border-radius:var(--r-sm);text-align:left;font-size:13px;color:var(--text2);line-height:1.6;">${esc(ci.content)}</div>
       </div>`
    : `<div class="checkin-area">
         <button class="checkin-btn" onclick="openCheckinModal()">今日打卡</button>
         <div style="margin-top:8px;font-size:12px;color:var(--text3);">记录今天的学习时间和内容</div>
       </div>`;

  // Recent check-ins
  const recent = Object.keys(prog.checkins).sort().reverse().slice(0, 5);
  const recentHtml = recent.length === 0
    ? '<div class="empty-state">暂无打卡记录，开始你的第一次打卡吧！</div>'
    : recent.map(d => {
        const c = prog.checkins[d];
        return `<div class="checkin-row">
          <div class="checkin-row-top">
            <span class="checkin-date">${fmtDate(d)} · ${d}</span>
            <span class="checkin-hours">${c.hours}h</span>
          </div>
          <div class="checkin-content">${esc(c.content)}</div>
        </div>`;
      }).join('');

  document.getElementById('view-dashboard').innerHTML = `
    <div class="page-header">
      <div class="page-title">今日仪表板</div>
      <div class="page-sub">${fmtDate(TODAY)} · ${u.name}</div>
    </div>
    ${alerts}
    <div class="grid-3" style="margin-bottom:12px;">
      <div class="stat-box">
        <div class="stat-label">今日目标</div>
        <div class="stat-value">${dailyH.toFixed(1)}</div>
        <div class="stat-unit">小时 / 天</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">章节进度</div>
        <div class="stat-value ${gap!==null&&gap<0?'red':'green'}">${actual}<span style="font-size:16px;color:var(--text3);">/${TOTAL_CHAPTERS}</span></div>
        <div class="stat-unit">${fmtGap(gap)}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">连续打卡</div>
        <div class="stat-value">${streak}</div>
        <div class="stat-unit">天</div>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
        <div style="font-size:13px;font-weight:500;">总体进度</div>
        <div style="font-family:var(--mono);font-size:11px;color:var(--text3);">${actual} / ${TOTAL_CHAPTERS} 章</div>
      </div>
      <div class="prog-bar" style="height:8px;">
        <div class="prog-fill green" style="width:${pct}%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px;">
        <span style="font-size:11px;color:var(--text3);">实际 ${pct}%</span>
        <span style="font-size:11px;color:var(--text3);">今日计划应达 ${planPct}%（${planned.toFixed(1)} 章）</span>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:13px;font-weight:500;margin-bottom:8px;">近 7 天打卡</div>
      <div class="streak-dots">${dots}</div>
      <div style="margin-top:6px;font-size:11px;color:var(--text3);">绿色=已打卡 · 橙色=今天未打卡 · 红色=缺卡</div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div style="font-size:13px;font-weight:500;margin-bottom:12px;">今日打卡</div>
      ${ciSection}
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:500;margin-bottom:10px;">近期打卡记录</div>
      ${recentHtml}
    </div>`;
}

function renderChapters() {
  const prog = getProgress(currentUser);
  const completed = prog.completedChapters;
  const actual = completed.length;
  const planned = plannedChaptersToday(currentUser) || 0;
  const gap = progressGap(currentUser);
  const pct = Math.round(actual / TOTAL_CHAPTERS * 100);
  const planPct = Math.min(100, Math.round(planned / TOTAL_CHAPTERS * 100));

  const chapters = Array.from({length: TOTAL_CHAPTERS}, (_, i) => {
    const n = i + 1;
    const done = completed.includes(n);
    return `<label class="ch-item ${done?'done':''}">
      <input type="checkbox" ${done?'checked':''} onchange="toggleChapter(${n}, this.checked)">
      <div>
        <div class="ch-num">CH.${String(n).padStart(2,'0')}</div>
        <div class="ch-name">第 ${n} 章</div>
      </div>
    </label>`;
  }).join('');

  document.getElementById('view-chapters').innerHTML = `
    <div class="page-header">
      <div class="page-title">章节进度</div>
      <div class="page-sub">SIE · 共 20 章 · 勾选已完成章节</div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div class="grid-2" style="margin-bottom:12px;">
        <div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;">实际完成</div>
          <div style="font-family:var(--mono);font-size:26px;font-weight:500;">${actual}<span style="font-size:14px;color:var(--text3);">/${TOTAL_CHAPTERS}</span></div>
        </div>
        <div>
          <div style="font-family:var(--mono);font-size:9px;color:var(--text3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:3px;">今日计划目标</div>
          <div style="font-family:var(--mono);font-size:26px;font-weight:500;">${planned.toFixed(1)}<span style="font-size:14px;color:var(--text3);"> 章</span></div>
        </div>
      </div>
      <div class="prog-bar" style="height:8px;">
        <div class="prog-fill ${gap!==null&&gap<0?'red':'green'}" style="width:${pct}%"></div>
      </div>
      <div style="display:flex;justify-content:space-between;margin-top:4px;">
        <span style="font-size:11px;color:var(--text3);">实际 ${pct}%</span>
        <span style="font-size:11px;color:var(--text3);">计划 ${planPct}%</span>
      </div>
      <div style="margin-top:8px;font-size:13px;">${fmtGap(gap)}</div>
    </div>
    <div class="card">
      <div style="font-size:13px;font-weight:500;margin-bottom:4px;">章节列表</div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:10px;">点击勾选已完成的章节</div>
      <div class="chapter-grid">${chapters}</div>
    </div>`;
}

function toggleChapter(num, checked) {
  const prog = getProgress(currentUser);
  if (checked && !prog.completedChapters.includes(num)) {
    prog.completedChapters.push(num);
    prog.completedChapters.sort((a,b)=>a-b);
  } else if (!checked) {
    prog.completedChapters = prog.completedChapters.filter(c => c !== num);
  }
  saveProgress(currentUser, prog);
  renderChapters();
}

function renderAdmin() {
  const users = Object.keys(USERS).filter(u => !USERS[u].isAdmin);

  const checkedIn = users.filter(u => !!todayCheckin(u)).length;
  const behindCnt = users.filter(u => { const g = progressGap(u); return g!==null && g<-1; }).length;

  const rows = users.map(username => {
    const u = USERS[username];
    const actual = completedCount(username);
    const gap = progressGap(username);
    const left = daysUntilExam(username);
    const ci = todayCheckin(username);
    const streak = checkinStreak(username);

    const gapBadge = gap===null ? '—'
      : gap<-2 ? `<span class="badge badge-red">落后 ${Math.abs(gap).toFixed(1)}章</span>`
      : gap>1  ? `<span class="badge badge-green">领先 ${gap.toFixed(1)}章</span>`
      : `<span class="badge badge-amber">持平</span>`;

    const ciBadge = ci
      ? `<span class="badge badge-green">✓ 已打卡</span>`
      : `<span class="badge badge-red">✗ 未打卡</span>`;

    return `<tr onclick="openAdminDetail('${username}')">
      <td><strong>${esc(u.name)}</strong></td>
      <td><span style="font-family:var(--mono);">${actual}/${TOTAL_CHAPTERS}</span></td>
      <td>${gapBadge}</td>
      <td>${ciBadge}</td>
      <td><span style="font-family:var(--mono);">${streak}天</span></td>
      <td><span style="font-family:var(--mono);">${left??'—'}天</span></td>
      <td style="font-size:12px;color:var(--text3);">${u.examDate||'—'}</td>
    </tr>`;
  }).join('');

  document.getElementById('view-admin').innerHTML = `
    <div class="page-header">
      <div class="page-title">所有人进度总览</div>
      <div class="page-sub">点击任意一行查看该用户的详细打卡记录</div>
    </div>
    <div class="grid-3" style="margin-bottom:16px;">
      <div class="stat-box">
        <div class="stat-label">今日已打卡</div>
        <div class="stat-value ${checkedIn<users.length?'amber':'green'}">${checkedIn}<span style="font-size:16px;color:var(--text3);">/${users.length}</span></div>
        <div class="stat-unit">人</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">落后人数</div>
        <div class="stat-value ${behindCnt>0?'red':'green'}">${behindCnt}</div>
        <div class="stat-unit">人落后进度</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">今日日期</div>
        <div class="stat-value" style="font-size:18px;">${fmtDate(TODAY)}</div>
        <div class="stat-unit">${TODAY}</div>
      </div>
    </div>
    <div class="card">
      <table class="admin-table">
        <thead>
          <tr>
            <th>姓名</th>
            <th>章节</th>
            <th>vs 计划</th>
            <th>今日打卡</th>
            <th>连续打卡</th>
            <th>剩余天数</th>
            <th>考试日期</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

function openAdminDetail(username) {
  const u = USERS[username];
  const prog = getProgress(username);
  const actual = completedCount(username);
  const gap = progressGap(username);
  const left = daysUntilExam(username);

  document.getElementById('detail-title').textContent = `${u.name} · 打卡记录`;
  document.getElementById('detail-sub').textContent =
    `章节进度 ${actual}/${TOTAL_CHAPTERS} · ${fmtGap(gap).replace(/<[^>]+>/g,'')} · 距考试 ${left??'—'} 天`;

  const dates = Object.keys(prog.checkins).sort().reverse();
  const body = dates.length === 0
    ? '<div class="empty-state">暂无打卡记录</div>'
    : dates.map(d => {
        const c = prog.checkins[d];
        return `<div class="checkin-row">
          <div class="checkin-row-top">
            <span class="checkin-date">${fmtDate(d)} · ${d}</span>
            <span class="checkin-hours">${c.hours}h</span>
          </div>
          <div class="checkin-content">${esc(c.content)}</div>
        </div>`;
      }).join('');

  document.getElementById('detail-body').innerHTML = body;
  document.getElementById('modal-admin-detail').classList.remove('hidden');
}

function saveWebhooks() {
  const cfg = getWebhookConfig();
  cfg.groupWebhook = document.getElementById('wh_group').value.trim();
  cfg.userOpenIds = cfg.userOpenIds || {};
  Object.keys(USERS).filter(u => !USERS[u].isAdmin).forEach(u => {
    const el = document.getElementById(`wh_${u}`);
    if (el) cfg.userOpenIds[u] = el.value.trim();
  });
  saveWebhookConfig(cfg);
  showToast('配置已保存 ✓');
}

function openCheckinModal() {
  document.getElementById('modal-checkin-date').textContent = `${fmtDate(TODAY)} · 今日学习记录`;
  document.getElementById('ci-hours').value = '';
  document.getElementById('ci-content').value = '';
  document.getElementById('modal-checkin').classList.remove('hidden');
}

function submitCheckin() {
  const hours = parseFloat(document.getElementById('ci-hours').value);
  const content = document.getElementById('ci-content').value.trim();
  if (!hours || hours <= 0) { showToast('请填写学习时长'); return; }
  if (!content) { showToast('请填写今天学了什么（必填）'); return; }
  if (content.length < 10) { showToast('学习内容描述太简短，请认真填写'); return; }

  const prog = getProgress(currentUser);
  prog.checkins[TODAY] = { hours, content, ts: new Date().toISOString() };
  saveProgress(currentUser, prog);
  closeModal('modal-checkin');
  showToast('打卡成功！');
  renderDashboard();
}

• DJIA: price-weighted, 30 stocks; S&P 500: market cap-weighted, 500 stocks`,

  7: `Chapter 7 – Packaged Products (Mutual Funds)

• Three types of investment companies: management companies (open/closed-end), UITs, face amount certificate companies
• Open-end funds (mutual funds): continuously issue/redeem shares at NAV; no secondary market trading
• Registration and prospectus requirements: must file with SEC; provide statutory or summary prospectus
• Key service providers: BOD, investment adviser, custodian bank, transfer agent, underwriter, dealers
• Major fund categories: money market, bond, equity, balanced, index, sector funds
• Pricing: NAV = (assets – liabilities) ÷ shares outstanding; POP = NAV ÷ (1 – sales charge %)
• Forward pricing: orders priced at next calculated NAV after order receipt
• Sales charges and share classes:
  – Class A: front-end load (breakpoints available); Class B: back-end load (CDSC); Class C: level load (12b-1)
• 12b-1 fees: ongoing fees for distribution and marketing (max 1% annually)
• Sales charge reductions: breakpoints, letters of intent (13 months), rights of accumulation
• Sales practice violations: breakpoint sales, large Class B purchases, unsuitable switching
• Dollar cost averaging: invest fixed dollar amount regularly; buys more shares at lower prices
• Closed-end funds: fixed shares; trade on exchanges like stock; may trade at premium or discount to NAV`,

  8: `Chapter 8 – Variable Contracts and Municipal Fund Securities

• Fixed annuity: guaranteed rate of return; held in insurer's general account
• Variable annuity: return varies with subaccount performance; held in separate account (registered with SEC)
• Separate account subaccounts: similar to mutual funds; subject to Investment Company Act of 1940
• Accumulation phase: contributions made, earnings tax-deferred; Annuity phase: periodic payments begin
• Withdrawals: taxed as ordinary income on gains (LIFO); 10% penalty if under 59½
• Payout options: life only, life with period certain, joint and survivor, lump sum
• Death benefit during accumulation: greater of account value or total premiums paid
• Charges: mortality & expense (M&E) risk charge, surrender charges, administrative fees
• Qualified annuity: funded with pre-tax dollars (e.g., in 401k); Non-qualified: funded with after-tax dollars
• Cost basis in non-qualified annuity: amount of after-tax contributions
• 1035 Exchange: tax-free exchange of one annuity/life policy for another
• Equity-indexed annuity: return linked to stock index; principal protection; not a security
• 529 plans: state-sponsored education savings; tax-free growth for qualified education expenses
• 529 ABLE plans: for individuals with disabilities; tax-free growth for disability expenses
• SECURE Act changes: 529 funds can roll into Roth IRA (lifetime max $35K)`,

  9: `Chapter 9 – Alternative Investments

• ETFs: investment companies but NOT mutual funds; passively managed (track an index); trade on exchanges like stocks
• Inverse ETF: moves opposite to its benchmark; Leveraged ETF: amplifies benchmark returns (2x, 3x)
• Leveraged inverse ETF: both amplified AND inverse
• ETNs (Exchange-Traded Notes): unsecured debt obligations of issuing bank; credit risk of the issuer is key
• Inverse ETN and Leveraged ETN also exist
• Hedge funds: private, largely unregulated; for accredited investors; use various strategies (long/short, leverage)
• REITs (Real Estate Investment Trusts): invest in real estate; must distribute 90% of income; taxed as corporations
  – Types: Equity REIT (owns properties), Mortgage REIT (holds mortgages), Hybrid REIT (both)
  – Investors taxed on dividends as ordinary income
• DPPs (Direct Participation Programs): flow-through investment vehicles; pass income/losses directly to investors
  – Forms: real estate, oil & gas, equipment leasing
• Limited partnerships: general partner (manages, unlimited liability) + limited partners (passive, limited liability)
• LP liquidation priority: secured creditors → unsecured creditors → limited partners → general partner`,

  10: `Chapter 10 – Options

• Option: contract giving buyer the right (not obligation) to buy or sell underlying at a set price by expiration
• Call option: right to buy; Put option: right to sell; both have buyers and sellers (writers)
• Option premium = Intrinsic Value + Time Value
  – Intrinsic value: in-the-money amount; Time value: remaining premium above intrinsic value
• In-the-money (ITM): call when market > strike; put when market < strike
• At-the-money (ATM): market = strike; Out-of-the-money (OTM): no intrinsic value
• Strategies: Long call / Short put = Bullish; Short call / Long put = Bearish
• Breakeven: call = strike + premium; put = strike − premium
• Maximum gain: long call = unlimited; long put = strike − premium; short call = premium received; short put = premium received
• Maximum loss: long call = premium paid; long put = premium paid; short call = unlimited; short put = strike − premium
• Covered call: writer owns the underlying stock (hedged); Uncovered/naked call: writer does not own stock
• Hedge: buying puts to protect a long stock position
• Option events: liquidation (close), exercise (buy/sell underlying), expiration (option expires worthless)
• OCC (Options Clearing Corporation): acts as counterparty to every option trade; guarantees performance
• Equity options: exercise = physical delivery of 100 shares; Index options: exercise = cash settlement`,

  11: `Chapter 11 – Offerings

• Public offering: registered with SEC; sold to general public; IPO = first public sale of a company's stock
• Private placement: sold to accredited investors; exempt from full registration
• Split (combined) offering: includes both new shares (primary) and existing shares (secondary)
• Underwriter/investment banker: manages the offering; Syndicate members: help distribute; Selling group: dealers who sell
• Underwriting types: Firm commitment (underwriter buys all), Best efforts (no guarantee), All-or-none, Mini-maxi, Stand-by
• Market out clause: allows underwriter to cancel if market conditions change significantly
• Shelf registration (Rule 415): allows issuer to register securities for sale over 2-year period
• POP = price at which securities are offered to the public; Underwriting spread = gross spread (profit for underwriters)
• Registration process: file S-1 with SEC → cooling-off period → effective date
• Prospectus types: Preliminary/Red Herring (no price), Statutory (final), Summary prospectus, Free writing prospectus
• Exempt securities: U.S. gov't, municipal bonds, non-profit organizations, commercial paper (<270 days)
• Accredited investor: net worth >$1M (excl. primary home) OR income >$200K/$300K (joint) for last 2 years
• Rule 144: allows resale of restricted/control stock with volume limits and holding period requirements
• Rule 144A: allows resale of restricted securities to QIBs without SEC registration
• Rule 145: business combinations (mergers, reclassifications); Rule 147/147A: intrastate offerings
• QIB: institutions with >$100M in securities; PIPE: private investment in public equity
• Municipal offerings: official statement = disclosure document; legal opinion = confirms tax-exempt status
• EMMA (Electronic Municipal Market Access): MSRB's public disclosure system for municipal bond information`,

  12: `Chapter 12 – Orders and Trading Strategies

• Broker (agent): executes trades on behalf of client; earns commission
• Dealer (principal): trades for own account; earns markup (buy from client) or markdown (sell to client)
• 5% policy: FINRA guideline for reasonable markups/markdowns/commissions; not a strict rule
• Factors affecting 5% policy: type of security, price, transaction size, services provided
• Proceeds transaction: customer sells one security and uses proceeds to buy another; entire transaction considered
• Transaction types: purchase (buy), long sale (sell securities you own), short sale (sell borrowed securities)
• Short sale: sell borrowed shares hoping price falls; must be bought back (covered) later
• Covered writer: option seller owns the underlying security; Uncovered/naked writer: does not own it
• Order types:
  – Market order: execute immediately at best available price
  – Limit order: execute only at specified price or better (buy at or below; sell at or above)
  – Stop order: becomes market order when stop price is reached (buy stop above market; sell stop below market)
  – Stop-limit order: becomes limit order (not market order) when stop price is triggered
• Day order: expires at end of trading day; GTC (Good 'Til Cancelled): remains until executed or cancelled
• Market maker quote: includes bid (buy) price and ask (sell) price, plus size (number of shares)
• Cash account: must pay in full by settlement; Margin account: may borrow up to 50% (Reg T initial requirement)`,

  13: `Chapter 13 – Settlement and Corporate Actions

• Regular-way settlement dates:
  – Corporate and municipal securities: T+1 (trade date plus 1 business day)
  – U.S. government securities and options: T+1
• Reg T payment date: T+2 for cash accounts; margin accounts must meet by T+2
• Failure to pay by Reg T date: securities are sold out; account frozen for 90 days
• Cash settlement: same-day settlement; must be agreed upon by both parties
• Good delivery: securities must be in proper form (correct denomination, properly endorsed)
• Stock power: separate form that allows transfer of securities without endorsing the certificate
• Tender offer: offer to buy shares from shareholders at a premium; can be by company or third party
  – Oversubscribed: shares prorated; Undersubscribed: fewer than needed shares tendered
• Forward stock split (e.g., 2-for-1): more shares at lower price; total value unchanged
  – 2-for-1: double shares, half price; cost basis per share is halved
• Reverse stock split: fewer shares at higher price (e.g., 1-for-2)
• Stock splits: not taxable events; cost basis per share is adjusted proportionally`,

  14: `Chapter 14 – Customer Accounts

• Cash account: customer pays full amount by settlement; no borrowing
• Margin account: customer borrows up to 50% of purchase price (Reg T); minimum equity $2,000
• Margin account disclosures: must provide margin disclosure document; customer must sign margin agreement
• Discretionary account: rep can make trades without prior client approval each time
  – Full power of attorney: complete control; Limited power of attorney: specified transactions only
• Not-held order: customer gives rep time and/or price discretion (not considered discretionary account)
• Fee-based account: flat fee regardless of trading activity; Commission-based: charged per transaction
• Coverdell ESA: education savings; $2,000/year contribution limit; tax-free for qualified education expenses
• Standard account opening: new account form requires name, address, DOB, SSN, employment, financial info
• Joint accounts: JTWROS (right of survivorship) or TIC (tenants in common — estate gets share)
• Custodial accounts (UGMA/UTMA): minor is beneficial owner; custodian manages until age of majority
• Retirement accounts comparison:
  – Traditional IRA: pre-tax contributions (if deductible), tax-deferred growth, RMDs at age 73
  – Roth IRA: after-tax contributions, tax-free growth, no RMDs
  – 401(k) / 403(b): employer-sponsored, pre-tax, tax-deferred, RMDs apply
  – SEP IRA / SIMPLE IRA: for self-employed and small businesses
• ERISA: federal law governing private employer retirement plans (eligibility, vesting, fiduciary duties)`,

  15: `Chapter 15 – Compliance Considerations

• New account requirements: name, address, DOB, SSN, employment, financial situation, investment objectives
• Trusted contact person: should be requested (NOT required); used if firm suspects financial exploitation
• FINRA's three suitability obligations:
  1. Reasonable Basis: product must be suitable for at least some investors
  2. Customer-Specific: product must be suitable for this particular customer
  3. Quantitative: trading frequency must not be excessive (anti-churning)
• Bank Secrecy Act / USA PATRIOT Act: require AML programs at all broker-dealers
• Three stages of money laundering: Placement (introduce cash) → Layering (disguise) → Integration (use funds)
• FinCEN reports:
  – Currency Transaction Report (CTR): cash transactions >$10,000
  – Suspicious Activity Report (SAR): suspicious transactions >$5,000; do NOT tell the customer
• Regulation S-P: requires firms to protect customers' non-public personal information (privacy notice)
• Customer communications categories:
  1. Correspondence: to ≤25 retail investors; 2. Retail Communication: to >25 retail investors; 3. Institutional Communication
• Telephone Consumer Protection Act (1991): restricts telemarketing and automated calls
• Business Continuity Plan (BCP): required for all member firms; addresses emergencies/disasters
• Recordkeeping requirements:
  – Lifetime: corporate/partnership documents
  – 6 years: blotters, account statements, new account forms, municipal complaints
  – 3 years: trade tickets, confirmations, employee records, all communications`,

  16: `Chapter 16 – Prohibited Activities

• Securities Exchange Act of 1934: prohibits all manipulative and deceptive trading practices
• Regulation M: prohibits manipulation of security prices during a distribution (new offering period)
• Prohibited activities:
  – Spreading false rumors to influence prices
  – Front-running: trading ahead of a large customer order to profit from anticipated price movement
  – Trading ahead of a research report
  – Marking the close/open: placing trades near close or open to influence prices
  – Churning: excessive trading to generate commissions (violates quantitative suitability)
  – Reverse churning: excessive inactivity in a fee-based account
• Prohibited trading practices:
  – Making payments to influence market price
  – Interpositioning: adding an unnecessary intermediary to increase markups
  – Insider trading: trading on material, non-public information
  – Quoting same security at different prices in different mediums
• Freeriding: buying and selling securities before paying for them (violates Reg T)
• FINRA New Issue (IPO) Rule: certain "restricted persons" cannot buy IPOs at POP
  – Restricted: broker-dealer employees, FINRA-associated persons, their immediate family
• Sharing in customer accounts: only allowed if written consent and proportional to investment
• Borrowing from or lending to clients: prohibited except in specific circumstances
• Financial exploitation: firms can put a temporary hold on suspicious transactions involving senior/specified adults
• Employees of one firm opening accounts at another firm: must notify both firms`,

  17: `Chapter 17 – SRO Requirements for Associated Persons

• SIE Exam: entry-level exam; does NOT grant any registration rights; must pass a top-off exam (Series 6, 7, etc.)
• Associated person: anyone employed by or associated with a FINRA member firm
• Non-registered persons: may perform clerical/administrative tasks only; cannot interact with public on securities business; no securities-based compensation
• Registered representative (RR): must pass qualification exams, maintain registration, complete CE
• Supervising principal: responsible for supervising RRs' activities
• Exam confidentiality: candidates cannot share exam content
• Form U4 (Uniform Application for Securities Industry Registration): required for all registered persons; filed through CRD
• CRD (Central Registration Depository): FINRA system that tracks registrations and disciplinary history
• Statutory disqualification: certain criminal convictions, regulatory sanctions, or court injunctions bar registration
• Eligibility proceeding: firm can request FINRA allow a disqualified person to associate under heightened supervision
• Fingerprinting: required for registered persons and certain non-registered persons
• FINRA vs. Blue Sky (state) registration: must meet both federal (FINRA) and state requirements
• Continuing Education (CE) requirements:
  – Regulatory Element: required FINRA computer-based training annually for all registered persons
  – Firm Element: firm-specific training developed and delivered by each member firm
• Special Inactive Status: given to registered persons on active military duty; maintains registration without CE`,

  18: `Chapter 18 – Employee Conduct and Reportable Events

• Form U4 contents: personal info (name, address, employment history), disclosure questions (criminal, regulatory, financial events), arbitration provisions
• Form U5: termination notice; must be filed within 30 days of termination; reason for departure disclosed
• Form U6: filed by regulators or firms to report disciplinary actions against an individual
• BrokerCheck: FINRA's public database showing registration history, exam results, and disciplinary history
  – Available for 10 years after termination for most disclosure events
• Investor education: FINRA and MSRB both have investor education requirements and resources
• Customer complaints: must be recorded and reported; FINRA requires quarterly reports; records kept 4 years at OSJ
• FINRA notification required for: certain criminal charges/convictions, regulatory actions, civil judicial actions, financial events (bankruptcy, liens >$2,500), customer complaints >$15,000
• Outside business activities (OBA): must be disclosed to and approved by employing firm via written notice
• Private securities transactions (Selling Away): selling securities not offered through employing firm; requires prior written approval
• Gifts: cannot give or receive gifts >$100/year per person from anyone connected with the securities business
• Training and educational seminars: permitted but cannot be lavish or primarily entertainment
• Political contributions (MSRB Pay-to-Play Rule): RRs cannot make contributions >$250 to officials who can influence municipal securities business`,

  19: `Chapter 19 – Economic Factors

• GNP (Gross National Product): value of goods/services produced by a country's residents, regardless of location
• GDP (Gross Domestic Product): value of all goods/services produced within a country's borders
• Inflation: rising price levels; measured by CPI (Consumer Price Index)
• Deflation: falling price levels; stagflation = inflation + recession simultaneously
• Real interest rate = nominal rate − inflation rate
• Business cycle phases: Expansion → Peak → Contraction/Recession → Trough (Recovery)
  – Recession: two consecutive quarters of declining GDP
  – Cyclical industries benefit in expansion; defensive industries hold steady in recession
• Economic indicators: Leading (predict future: stock prices, building permits), Coincident (current: GDP, employment), Lagging (confirm past: CPI, unemployment rate)
• Key interest rates: Prime rate (bank loans to best customers), Discount rate (Fed charges banks), Fed Funds rate (bank-to-bank overnight), Broker Call rate (banks charge broker-dealers for margin loans)
• Keynesian economics: government spending stimulates the economy
• Monetary policy: FRB controls money supply and interest rates
• Yield curves: Normal (upward slope), Inverted (downward = recession signal), Flat (transition)
• FRB tools: Open market operations (buy/sell Treasuries), Discount rate, Reserve requirements
  – Buying Treasuries → increases money supply → lowers rates; Selling → decreases money supply → raises rates
• Balance of payments: tracks all financial transactions between a country and the rest of the world
• Balance sheet: assets = liabilities + equity; snapshot of financial position at a point in time
• Income statement: revenues − expenses = net income; shows profitability over a period`,

  20: `Chapter 20 – Investment Risks

• Systematic risk (non-diversifiable): affects the entire market; cannot be eliminated through diversification
  – Market risk: risk of overall market decline (affects all equity securities)
  – Interest rate risk: bond prices fall when rates rise (affects all fixed income securities)
  – Inflation risk (purchasing power risk): return may not keep pace with inflation
  – Event risk: unexpected events (natural disasters, political events)
• Non-systematic risk (diversifiable): specific to one company or industry; can be reduced through diversification
  – Business risk: risk of company failing or performing poorly
  – Regulatory/legislative risk: new laws affect a company or industry
  – Capital risk: risk of losing invested principal
  – Liquidity risk: difficulty selling an investment quickly at fair price
  – Currency risk: foreign investments affected by exchange rate changes
  – Political risk: foreign investments affected by political instability
  – Credit risk: issuer may default (relevant to bonds/debt instruments)
  – Prepayment risk: mortgages/bonds may be paid off early when rates fall (MBS)
• Alpha: measures excess return above/below benchmark (manager's skill); Beta: measures sensitivity to market moves
  – Beta >1: more volatile than market; Beta <1: less volatile; Beta =1: moves with market
• Duration: measure of interest rate risk for bonds; longer duration = greater price sensitivity to rate changes
• Efficient Market Hypothesis (EMH): stock prices already reflect all available information; active management cannot consistently beat the market
• Asset allocation strategies:
  – Strategic (passive): long-term target allocation; buy-and-hold, indexing, portfolio rebalancing
  – Tactical (active): short-term adjustments; sector rotation
• Options as hedges: buying puts protects against downside in stock positions; buying calls hedges short positions`
};

let kbChapter = 1, kbFilter = 'all';

async function saveChapterNote(chapterNum, content, isPublic) {
  const { data, error } = await sb.from('chapter_notes').insert({
    chapter_num: chapterNum,
    username: currentUser,
    content,
    is_public: isPublic,
    created_at: new Date().toISOString()
  }).select().single();
  if (!error && data) DB.chapterNotes.push(data);
  return !error;
}

function renderKnowledge() {
  const chapNotes = DB.chapterNotes.filter(n => {
    if (n.chapter_num !== kbChapter) return false;
    if (kbFilter === 'mine') return n.username === currentUser;
    return n.is_public || n.username === currentUser;
  });

  const pills = Array.from({length: TOTAL_CHAPTERS}, (_, i) => {
    const n = i + 1;
    return `<div class="ch-pill ${n === kbChapter ? 'active' : ''}" onclick="setKbChapter(${n})">第${n}章</div>`;
  }).join('');

  const officialNote = OFFICIAL_NOTES[kbChapter];
  const officialSection = `<div class="official-box">
    <div class="official-label">📋 官方精读</div>
    <div class="official-body">${officialNote ? esc(officialNote) : '<span style="color:var(--text3);font-style:italic;">本章官方精读内容尚未录入，敬请期待。</span>'}</div>
  </div>`;

  const noteCards = chapNotes.length === 0
    ? '<div class="empty-state">暂无笔记，成为第一个分享学习心得的人吧！</div>'
    : chapNotes.map(n => {
        const author = USERS[n.username]?.name || n.username;
        const isOwn = n.username === currentUser;
        const dt = new Date(n.created_at);
        const dtStr = `${dt.getMonth()+1}月${dt.getDate()}日`;
        return `<div class="note-card">
          <div class="note-meta">
            <span class="note-author">${esc(author)}</span>
            <div class="note-badges">
              ${!n.is_public && isOwn ? '<span class="badge badge-amber">🔒 私密</span>' : '<span class="badge badge-green">公开</span>'}
              <span style="font-family:var(--mono);font-size:10px;color:var(--text3);">${dtStr}</span>
            </div>
          </div>
          <div class="note-body">${esc(n.content)}</div>
        </div>`;
      }).join('');

  const addForm = `<div class="note-add-form">
    <div style="font-size:13px;font-weight:500;margin-bottom:8px;">添加笔记</div>
    <textarea class="form-textarea" id="kb-note-input" style="min-height:80px;" placeholder="分享你对第 ${kbChapter} 章的学习笔记、重点或心得…"></textarea>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
      <label class="privacy-toggle">
        <input type="checkbox" id="kb-note-public" checked>
        <span style="font-size:12px;color:var(--text2);">公开（所有人可见）</span>
      </label>
      <button class="btn btn-primary" style="padding:7px 16px;" onclick="submitNote()">发布笔记</button>
    </div>
  </div>`;

  document.getElementById('view-knowledge').innerHTML = `
    <div class="page-header">
      <div class="page-title">知识库</div>
      <div class="page-sub">官方精读 + 学员笔记 · 共 ${TOTAL_CHAPTERS} 章</div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div class="section-hdr">选择章节</div>
      <div class="ch-pills">${pills}</div>
    </div>
    <div class="card" style="margin-bottom:12px;">${officialSection}</div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="section-hdr" style="margin-bottom:0;">学员笔记 <span class="sec-count">${chapNotes.length}</span></div>
        <div class="filter-pills">
          <div class="filter-pill ${kbFilter==='all'?'active':''}" onclick="setKbFilter('all')">全部公开</div>
          <div class="filter-pill ${kbFilter==='mine'?'active':''}" onclick="setKbFilter('mine')">只看我的</div>
        </div>
      </div>
      ${noteCards}
      ${addForm}
    </div>`;
}

function setKbChapter(n) { kbChapter = n; renderKnowledge(); }
function setKbFilter(f) { kbFilter = f; renderKnowledge(); }

async function submitNote() {
  const content = document.getElementById('kb-note-input').value.trim();
  if (!content) { showToast('请填写笔记内容'); return; }
  if (content.length < 5) { showToast('笔记内容太简短'); return; }
  const isPublic = document.getElementById('kb-note-public').checked;
  const btn = document.querySelector('#view-knowledge .btn-primary');
  if (btn) btn.disabled = true;
  const ok = await saveChapterNote(kbChapter, content, isPublic);
  if (ok) { showToast('笔记已发布 ✓'); renderKnowledge(); }
  else { showToast('发布失败，请重试'); if (btn) btn.disabled = false; }
}

// ══════════════════════════════════════════════
//  APP LIFECYCLE
// ══════════════════════════════════════════════
function handleLogin() {
  const sel = document.getElementById('login-select').value;
  if (!sel) { showToast('请选择账号'); return; }
  localStorage.setItem('sie_user', sel);
  currentUser = sel;
  startApp(sel);
}

function handleLogout() {
  localStorage.removeItem('sie_user');
  currentUser = null;
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('login-screen').style.display = 'flex';
}

function startApp(username) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').classList.remove('hidden');
  getProgress(username); // ensure initialized
  renderSidebar(username);
  switchView(USERS[username].isAdmin ? 'admin' : 'dashboard');
}

async function init() {
  await loadAllData();
  document.getElementById('loading-overlay').classList.add('hidden');
  const saved = localStorage.getItem('sie_user');
  if (saved && USERS[saved]) { currentUser = saved; startApp(saved); }
}

init();
</script>
