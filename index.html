一、美国国债（Treasury Securities）概览
══════════════════════════════════════

📄 原文：
"Treasury securities are considered the safest type of fixed-income investment and are suitable for the most conservative investors. Since the securities are backed by the full faith and credit of the U.S. government, they have virtually no credit risk. This 'no default' status is the benchmark against which the credit ratings of all other issuers are measured."

【考点解析】
- 信用风险最低（几乎为零），是所有其他发行方信用评级的基准
- 免于1933年证券法注册要求（豁免证券）
- 利息：联邦应税，免州/地方税

| 类型                | 期限              | 特点                                    |
|---------------------|-------------------|-----------------------------------------|
| T-Bills（国库券）   | ≤1年（4/13/26/52周）| 零息折价；收益率报价；最小面值$100     |
| T-Notes（中期国债） | 2–10年            | 半年付息；电子化；最小面值$100          |
| T-Bonds（长期国债） | >10年             | 半年付息；电子化；最小面值$100          |
| TIPS                | 5、10、30年       | 本金按CPI调整；利率固定                 |
| STRIPS              | 零息              | 剥离国债利息/本金创建；收益率报价       |
| CMBs（现金管理票据）| 极短期（可至1天） | 非定期发行；现金流管理                  |

⚠️ 考试提示：T-Bills是唯一以收益率报价的国债；国债利息免州/地方税

══════════════════════════════════════
二、TIPS（通胀保护国债）
══════════════════════════════════════

📄 原文：
"The rate of interest on TIPS is fixed; however, the principal amount on which that interest is paid may vary based on the change in the Consumer Price Index (CPI). During a period of inflation (a rise in CPI), the principal value will increase. However, if deflation occurs (from a decline in CPI), the principal value of the instrument will decrease (but not below $1,000)."

【考点解析】
- 利率固定，但计息基准（本金）随CPI变动
- 通胀期（CPI上升）：本金增加 → 利息增加
- 通缩期（CPI下降）：本金减少，但不低于原始面值$1,000
- 利息：联邦应税，免州/地方税

例题：
4% TIPS，本金因通胀调整为$1,030
年利息 = $1,030 × 4% = $41.20
半年利息 = $41.20 ÷ 2 = $20.60

⚠️ 考试提示：TIPS通缩保护下限为原始面值$1,000

══════════════════════════════════════
三、STRIPS 与 T-Bills 报价
══════════════════════════════════════

📄 原文：
"The Treasury created its Separate Trading of Registered Interest and Principal Securities (STRIPS) program. Dealers are able to purchase T-notes and T-bonds and separately resell the coupon and principal payments as zero-coupons... STRIPS are backed by the full faith and credit of the U.S. Treasury and are quoted on a yield basis."

【考点解析】
STRIPS：
- 将国债的利息和本金"剥离"后分别作为零息债券出售
- 以收益率报价（非面值百分比）
- 有美国财政部的完全信用背书

区分易混概念：
- Treasury Receipts (TRs)：由经纪商发行，仅由国债作担保（非财政部直接背书）
- Treasury STRIPS：财政部官方计划，有完全直接背书

T-Bills报价特殊性：
- 以折现收益率（Discount Yield）报价，非面值百分比
- Bid收益率 > Asked收益率（因价格与收益率反向）
- 债券等价收益率（Bond Equivalent Yield）始终 > 折现收益率

⚠️ 考试提示：STRIPS有财政部背书；Treasury Receipts没有

══════════════════════════════════════
四、国债拍卖（Treasury Auctions）
══════════════════════════════════════

📄 原文：
"When Treasury auctions are held, securities firms compete by submitting bids to buy Treasuries through an automated system... Non-competitive bids are filled first; however, the bidders must agree to accept the yield and price as determined by the auction. All winners of the auction will ultimately pay the lowest price of the accepted competitive tenders. This single price auction process is referred to as a Dutch auction."

【考点解析】
竞争性投标（Competitive Tender）：
- 由证券公司参与，指定价格/收益率
- 类似限价买入订单，可能不成交
- 填单顺序靠后

非竞争性投标（Non-Competitive Tender）：
- 个人投资者参与，不指定价格
- 类似市价买入订单，保证成交
- 优先成交，但接受拍卖决定的价格

荷兰式拍卖（Dutch Auction）：
- 所有获胜者以最低接受价格（最低竞争中标价）统一成交
- Single Price Auction（统一价格拍卖）

拍卖时间表：
| 品种              | 拍卖频率          | 发行时间              |
|------------------|-------------------|-----------------------|
| 4周国库券         | 每周              | 周二拍卖，周四发行    |
| 13/26周国库券     | 每周              | 周一拍卖，周四发行    |
| 52周国库券        | 每4周             | 周二拍卖，周四发行    |
| 2/3/5年期国债     | 每月              | 月底发行              |
| 10年期国债        | 每季度（2/5/8/11月）| 15日发行            |
| 30年期国债        | 每季度（2/5/8/11月）| 15日发行            |

⚠️ 考试提示：非竞争性投标先成交；荷兰式拍卖=统一价格

══════════════════════════════════════
五、机构证券（Agency Securities）
══════════════════════════════════════

📄 原文：
"Agency securities include debt instruments that are issued and/or guaranteed by federal agencies and by government-sponsored enterprises (GSEs)... their yields are slightly higher than the yields of corresponding U.S. Treasury securities."

【考点解析】
联邦机构（Federal Agencies）——有政府完全信用背书：
- GNMA（吉利美）：属于HUD；有美国政府完全信用背书；利息全部应税（联邦+州+地方）

政府支持企业（GSEs）——私人拥有，国会授权，无直接政府背书：
- FNMA（房利美）：购买FHA/VA/传统抵押贷款；利息全部应税
- FHLMC（房地美）：为储蓄机构融资；利息全部应税
- FFCB（联邦农业信贷银行）：农业贷款；利息联邦应税，免州/地方税
- FHLB（联邦住房贷款银行）：为储蓄机构提供流动性；利息联邦应税，免州/地方税

税务速查：
| 机构   | 联邦税 | 州/地方税 |
|--------|--------|-----------|
| GNMA   | 应税   | 应税      |
| FNMA   | 应税   | 应税      |
| FHLMC  | 应税   | 应税      |
| FFCB   | 应税   | 免税      |
| FHLB   | 应税   | 免税      |

⚠️ 考试提示：GNMA是唯一有政府完全背书的抵押机构；GNMA/FNMA/FHLMC利息全部应税

══════════════════════════════════════
六、抵押贷款支持证券（MBS）与预付款风险
══════════════════════════════════════

📄 原文：
"The most common security issued by government agencies is a mortgage-backed pass-through certificate... In addition to the risks that are inherent in many fixed-income investments (e.g., interest-rate, credit, and liquidity risk), mortgage-backed securities are subject to a special type of risk which is referred to as prepayment risk. This is the risk that's tied to homeowners paying off their mortgages early."

【考点解析】
传递证书（Pass-Through Certificate）：
- 发行方将一批抵押贷款打包成资产池
- 向投资者出售对该资产池的不可分割权益
- 月度付款（利息+本金混合）传递给投资者

GNMA 修正传递证书特点：
- 由FHA/VA抵押贷款支持
- GNMA 保证每月按时支付（即使房主未还款）
- 名义期限25–30年，实际平均寿命更短

预付款风险（Prepayment Risk）——MBS特有：
- 利率下降时，房主倾向于重新融资提前还款
- 投资者面临本金提前返还，但再投资收益率更低
- 这是MBS与普通债券的核心区别

资产支持证券（ABS）：
- 将信用卡应收款、汽车贷款、学生贷款等打包证券化
- 优点：较高收益率、高信用质量、现金流可预测
- 风险：利率风险、信用风险、预付款风险

⚠️ 考试提示：预付款风险是MBS独特风险；利率降→提前还款→再投资收益降

══════════════════════════════════════
七、市政债券（Municipal Bonds）
══════════════════════════════════════

📄 原文：
"Municipal bonds are issued by states, territories and possessions of the United States, as well as other political subdivisions... For most investors, the primary advantage of municipal bonds is that the interest received is typically exempt from federal tax."

【考点解析】
市政债基本特征：
- 发行方：州、地方政府、公共机构（如市政局）
- 有一定违约风险（非联邦政府背书）
- 利息：通常免联邦税
- 本州债券利息通常还免州/地方税（三重免税效果）

两大类型对比：
| 项目       | GO债（一般责任债）              | Revenue债（收益债）            |
|-----------|-------------------------------|-------------------------------|
| 还款来源   | 税收（不动产税/所得税等）       | 项目收入（过路费、使用费等）    |
| 需要选民批准| 是                            | 否                             |
| 可行性研究  | 否                            | 是                             |
| 债务上限   | 受约束                        | 不受约束                       |
| 风险       | 相对较低                      | 相对较高（依赖项目收入）        |

各类收益债券：
- 住房收益债（Housing Revenue）：租金/抵押贷款还款
- 宿舍债（Dormitory）：学生学费
- 医疗卫生债（Health Care）：非营利医院收入
- 公用事业债（Utility Revenue）：用户费用
- 交通债（Transportation）：通行费
- 特殊税收债（Special Tax）：特定税收（非地产税）
- 特别评估债（Special Assessment）：受益者专项收费
- 道义责任债（Moral Obligation）：项目收入+州道义背书（非法律义务）
- 工业发展债（IDB）：企业租赁付款；信用评级基于企业（非市政）
- 双重担保债（Double-Barreled Bond）：同时有收入和税收来源

⚠️ 考试提示：GO债=选民批准+税收；Revenue债=可行性研究+项目收入——高频对比考点

══════════════════════════════════════
八、市政票据（Municipal Notes）
══════════════════════════════════════

📄 原文：
"Municipal notes are short-term issues that are normally issued to assist in financing a project or to assist a municipality in managing its cash flow."

【考点解析】
| 缩写  | 全称                              | 用途                     |
|-------|-----------------------------------|--------------------------|
| TAN   | Tax Anticipation Note             | 预期未来税收，用于当前运营 |
| RAN   | Revenue Anticipation Note         | 预期未来收入（联邦/州补贴）|
| TRAN  | Tax & Revenue Anticipation Note   | TAN+RAN合并              |
| BAN   | Bond Anticipation Note            | 为最终发行长期债券过渡融资 |
| GAN   | Grant Anticipation Note           | 预期联邦补助金            |
| CLN   | Construction Loan Note            | 为建设项目提供临时资金    |

市政票据评级：
- Moody's：MIG 1（最高）→ MIG 2 → MIG 3 → SG（投机）
- VRDOs 使用 VMIG 体系
- S&P：SP-1+ → SP-1 → SP-2 → SP-3

⚠️ 考试提示：BAN是为最终长期债券发行前的过渡融资，常考

══════════════════════════════════════
九、市政债发行流程
══════════════════════════════════════

📄 原文：
"Like U.S. government and government agency securities, municipal securities are exempt from the registration and prospectus requirements of the Securities Act of 1933... The underwriter acts as a vital link between the issuer and the investing public by assisting the issuer in pricing the securities, structuring the financing, and preparing a disclosure document (referred to as the official statement)."

【考点解析】
市政债免于1933年证券法注册（豁免证券）
披露文件：Official Statement（官方声明，非招募书）

GO债发行要求：
1. 选民批准
2. 不超过债务上限

Revenue债发行要求：
1. 可行性研究（聘请咨询工程师评估项目可行性）
2. 无需选民批准

承销方式：
| 证券类型                | 主要承销方式                    |
|------------------------|--------------------------------|
| 美国国债                | 拍卖（Auction）                |
| 市政一般责任债（GO）    | 竞争性销售（Competitive Sale） |
| 市政收益债              | 协商销售（Negotiated Sale）    |
| 企业债                  | 协商销售（Negotiated Sale）    |

竞争性销售：邀请多家承销商竞标，最低利率成本者获选
协商销售：发行方直接指定承销商，协商条款

⚠️ 考试提示：GO债=竞争性销售；Revenue债/企业债=协商销售

══════════════════════════════════════
十、企业债券（Corporate Bonds）
══════════════════════════════════════

📄 原文：
"Corporate bonds are divided into two major categories—secured and unsecured. Although all debt that's issued by a corporation is backed by the issuer's full faith and credit, secured bonds are additionally backed by specific corporate assets."

【考点解析】
有担保债券（Secured Bonds）：
- 抵押债（Mortgage Bond）：不动产（第一或第二抵押权）
- 设备信托证书（Equipment Trust Certificate）：特定设备（铁路车厢、飞机等）
- 担保信托债（Collateral Trust Bond）：第三方有价证券（股票/债券）放入托管

无担保债券（Unsecured Bonds / Debentures）：
- 仅凭公司完全信用担保
- 违约时与普通债权人同等索偿权

次级无担保债（Subordinated Debentures）：
- 清算时索偿权低于普通无担保债权人
- 但仍优先于股东

完整清算顺序（6步，必背）：
1. 有担保债权人（包括有担保债券）
2. 行政费用（税款、工资、律师/会计师）
3. 普通债权人（包括无担保债券/Debentures）
4. 次级债权人（Subordinated Debentures）
5. 优先股股东
6. 普通股股东

高收益债/垃圾债（High-Yield / Junk Bonds）：
- S&P评级低于BBB / Moody's低于Baa
- 更高违约风险 → 更高票面利率补偿

其他类型：
- 收益债（Income Bonds）：只有盈利才支付利息；平价交易（无应计利息）；高度投机
- 担保债（Guaranteed Bond）：母公司为子公司债券提供担保

⚠️ 考试提示：Debenture=无担保；Subordinated Debenture=次级无担保；清算顺序必须背熟

══════════════════════════════════════
十一、国际债券（Eurodollar / Yankee / Eurobonds）
══════════════════════════════════════

📄 原文：
"Eurodollar bonds pay their principal and interest in U.S. dollars, but are issued outside of the United States (primarily in Europe)... Yankee bonds allow foreign entities to borrow money in the U.S. marketplace. These bonds are registered with the SEC and sold primarily in the United States."

【考点解析】
| 类型               | 发行地            | 计价货币   | 监管    |
|--------------------|-------------------|------------|---------|
| 欧洲美元债         | 美国境外（欧洲）  | 美元       | 非SEC   |
| 扬基债（Yankee）   | 美国境内          | 美元       | SEC注册 |
| 欧洲债（Eurobond） | 某国境内          | 另一国货币 | 多样化  |

例：俄罗斯企业在伦敦发行瑞士法郎计价债券 = Eurobond（外付债）

⚠️ 考试提示：Yankee Bond=外国实体在美国发行的美元债，需SEC注册

══════════════════════════════════════
十二、货币市场工具（Money Market Securities）
══════════════════════════════════════

📄 原文：
"Short-term debt instruments with one year or less to maturity are referred to as money-market securities... Commercial paper is short-term, unsecured corporate debt which typically matures in 270 days or less. Due to its short maturity, commercial paper is exempt from the registration and prospectus requirements of the Securities Act of 1933."

【考点解析】
| 工具                        | 发行方 | 特点                                         |
|----------------------------|--------|----------------------------------------------|
| 商业票据（Commercial Paper）| 公司   | 期限≤270天；无担保；最小$100,000；折价；免注册 |
| 银行承兑汇票（BA）          | 银行   | 促进国际贸易；货物+银行双重担保               |
| 可转让存单（Negotiable CD） | 银行   | 最低$100,000；有二级市场；$250K以下FDIC保障   |
| 联邦基金（Fed Funds）       | 银行间 | 隔夜拆借；每日波动；FRB间接影响               |
| 回购协议（Repo）            | 经纪商 | 抵押证券借贷；通常隔夜                        |
| 逆回购（Reverse Repo）      | 经纪商 | 买入证券同时约定回售                          |

商业票据信用评级：
- S&P：A1（最高）→ A2 → A3
- Fitch：F1+（最高）→ F1 → F2 → F3
- Moody's：P-1（最高）→ P-2 → P-3；投机级=NP（Not Prime）

利率关系：
- 联邦基金利率影响其他短期利率（FRB不直接设定）
- 优惠利率（Prime Rate）=银行对最佳客户的贷款利率
- SOFR（担保隔夜融资利率）=LIBOR的替代基准利率

⚠️ 考试提示：商业票据≤270天免注册；最小面值$100,000；联邦基金利率非FRB直接设定；LIBOR已被SOFR替代

══════════════════════════════════════
十三、债券利息税务总结（必考速查表）
══════════════════════════════════════

📄 原文：
"The interest received on T-notes and T-bonds is taxed at the federal level, but exempt from state and local taxation... Any interest earned on [GNMA securities] is subject to federal, state, and local taxes."

【考点解析】
| 证券类型                              | 联邦税 | 州/地方税  |
|--------------------------------------|--------|-----------|
| T-Bill / T-Note / T-Bond             | 应税   | 免税      |
| TIPS / STRIPS                        | 应税   | 免税      |
| GNMA（吉利美）                       | 应税   | 应税      |
| FNMA（房利美）                       | 应税   | 应税      |
| FHLMC（房地美）                      | 应税   | 应税      |
| FFCB / FHLB                          | 应税   | 免税      |
| 市政债（Municipal Bonds）            | 免税   | 视情况*   |
| 领土/属地债券（Territory/Possession） | 免税   | 免税      |
| 企业债（Corporate Bonds）            | 应税   | 应税      |

*市政债：大多数州对本州居民购买本州债券免州/地方税
"三免"规则：市政债 + 投资者为该州居民 = 联邦、州、地方税全免

⚠️ 考试提示：税务表是必须熟背的速查表；GNMA全部应税；国债免州税；市政债免联邦税

══════════════════════════════════════
一、普通股（Common Stock）
══════════════════════════════════════

📄 原文：
"Outstanding shares = Issued shares − Treasury shares"

【考点解析】
▸ 股份四种状态（必背）：
  • Authorized（授权股）：公司章程允许的最大发行量
  • Issued（已发行）：已实际发行给投资者的股份
  • Treasury（库存股）：公司回购的自有股——无投票权，不获股息
  • Outstanding（流通股）= Issued − Treasury

▸ 普通股股东权利：
  • 查阅公司财务记录
  • 选举董事会、对重大事项投票（合并、股票分拆等）
  • 股息权（但是否派发由董事会决定，股东不投票）
  • 证券转让权；破产清算时剩余财产请求权（排最末）

⚠️ 考试提示：股东无权对股息发放投票——这是董事会权力（高频陷阱）

══════════════════════════════════════
二、投票机制（Voting Methods）
══════════════════════════════════════

| 投票方式 | 机制 | 受益方 |
|----------|------|--------|
| 法定投票（Statutory） | 每股每项议题1票 | 大股东（多数派） |
| 累积投票（Cumulative） | 总票数=持股×候选人数，可集中投给一人 | 小股东（少数派） |

例：持有1,000股，选举3名董事
  法定投票：每位候选人最多1,000票
  累积投票：共3,000票，可全投给同一人

⚠️ 考试提示：累积投票保护少数股东——高频考点

══════════════════════════════════════
三、优先股（Preferred Stock）
══════════════════════════════════════

📄 原文：
"Preferred stockholders have a senior claim on assets over common stockholders, but a junior claim compared to bondholders. Preferred stock typically pays a fixed dividend based on its par value ($100)."

【考点解析】
▸ 基本特征：面值$100；固定股息；无投票权；利率敏感（利率↑→价格↓）

▸ 五类优先股（必背）：
| 类型 | 关键特征 |
|------|---------|
| 累积型（Cumulative） | 积欠股息（Arrears）必须全额补发，才能对普通股派息 |
| 非累积型（Non-cumulative） | 未派股息直接作废，无补发义务 |
| 参与型（Participating） | 固定股息之外，还可分享额外超额利润 |
| 可赎回型（Callable） | 公司可按约定价格提前赎回 |
| 可转换型（Convertible） | 可按固定比率转换为普通股 |

▸ 可转换优先股计算：
  转换比率 = $100面值 ÷ 转换价格
  转换价值 = 转换比率 × 当前股价

⚠️ 考试提示：Dividends in Arrears只有累积型才有；优先股面值=$100（非$1,000）

══════════════════════════════════════
四、认购权（Rights）与认股权证（Warrants）
══════════════════════════════════════

| 特征 | Rights（认购权） | Warrants（认股权证） |
|------|----------------|-------------------|
| 认购价格 | 低于当前市场价 | 高于当前市场价 |
| 有效期限 | 短（约30–45天） | 长（通常数年） |
| 分发对象 | 现有普通股股东 | 新债券/优先股购买者 |
| 主要目的 | 维持股东持股比例 | 作为债券的"甜头"（sweetener） |

⚠️ 考试提示：Rights低于市价；Warrants高于市价——必考对比

══════════════════════════════════════
五、美国存托凭证（ADRs）
══════════════════════════════════════

📄 原文：
"ADRs allow investors to purchase securities of foreign companies in U.S. markets, priced and paying dividends in U.S. dollars."

【考点解析】
▸ 外国公司股票在美国市场交易；以美元计价和派息
▸ 仍具汇率风险（外币→美元转换风险）
▸ 无优先认购权（No Preemptive Rights）
▸ Sponsored ADR：交易所上市，发行公司赞助
▸ Unsponsored ADR：OTC市场，银行自行发行

⚠️ 考试提示：ADR无优先认购权（易错高频点）

══════════════════════════════════════
六、股息关键日期（Dividend Dates）
══════════════════════════════════════

▸ 顺序（必背）：
  1. 宣布日（Declaration Date）：董事会宣布股息
  2. 除息日（Ex-Dividend Date）：T+1结算下 = 登记日前1个交易日
     → 在除息日当天或之后买入的股东不获此次股息
  3. 登记日（Record Date）：确定有权获息的股东名单
  4. 支付日（Payment Date）：实际发放股息

📄 原文：ETNs are unsecured debt obligations of their issuer; investors face issuer credit risk.

【考点解析】

• 无利息支付；到期按约定指数收益偿还
• 期限：10–30 年
• 主要风险：发行人信用风险（Issuer Credit Risk）
• 若发行银行违约，投资者损失全部本金

📄 原文：Hedge funds are not registered under the Investment Company Act of 1940; sold via Reg D.

• 仅面向**合格投资者**（Accredited Investors）：个人净资产 >$1M（不含主宅），或年收入 >$200K（联合 >$300K）
• 费用结构：2-and-20（2%管理费 + 20%业绩分成）

📄 原文：REITs must distribute at least 90% of taxable income to qualify for pass-through tax treatment.

• 三类 REITs：

  - Equity REIT（权益型）：直接拥有不动产

══════ 期权基本术语 ══════

| 术语 | 含义 |
|------|------|
| 买方（Buyer）= Long = Holder | 支付权利金，获得权利 |
| 卖方（Seller）= Writer = Short | 收取权利金，承担义务 |
| Call（看涨期权）| 买入权利；买方看涨 |
| Put（看跌期权）| 卖出权利；买方看跌 |
| 权利金（Premium）| 买方付出的期权价格 |
| 执行价（Strike Price）| 约定的买入/卖出价格 |
| 合约规模 | 1 份合约 = 100 股 |

══════ 期权价值构成 ══════

权利金 = 内在价值（Intrinsic Value）+ 时间价值（Time Value）

| 状态 | Call | Put |
|------|------|-----|
| 实值（ITM）| 市价 > 执行价 | 市价 < 执行价 |
| 平值（ATM）| 市价 = 执行价 | 市价 = 执行价 |
| 虚值（OTM）| 市价 < 执行价 | 市价 > 执行价 |

⚠️ 只有实值期权有内在价值；虚值期权内在价值 = 0

══════ 盈亏平衡价格 ══════

| 期权类型 | 公式 | 记忆口诀 |
|---------|------|---------|
| Call（看涨）| 执行价 + 权利金 | "Call UP"（往上走才盈利）|
| Put（看跌）| 执行价 − 权利金 | "Put DOWN"（往下走才盈利）|

例题：
• 买入 Call，执行价 $50，权利金 $3 → 盈亏平衡 = $53
• 买入 Put，执行价 $50，权利金 $3 → 盈亏平衡 = $47

══════ 期权风险/收益矩阵 ══════

| 头寸 | 最大收益 | 最大亏损 |
|------|---------|---------|
| 买入 Call（Long Call）| 无限（股价可无限上涨）| 权利金（Premium）|
| 卖出 Call 无担保（Short Naked Call）| 权利金 | 无限 |
| 买入 Put（Long Put）| 执行价 − 权利金（股价跌至0）| 权利金 |
| 卖出 Put（Short Put）| 权利金 | 执行价 − 权利金 |

══════ 期权类型与行权规则 ══════

| 类型 | 行权时机 | 适用品种 |
|------|---------|---------|
| 美式（American）| 到期前任何时间 | 股权期权（Equity Options）|
| 欧式（European）| 仅到期日 | 指数期权、货币期权 |

指数期权（Index Options）：现金结算（Cash Settlement），不交割股票

══════ 期权行权流程 ══════

买方通知 BD → BD 通知 OCC → OCC 随机指定 → 被指定 BD → 分配给客户（随机/FIFO/公平方式）

• OCC（期权清算公司）保证所有上市期权的履约
• 结算：T+1（期权交易后1个工作日）

══════ 期权到期规则 ══════

• 期权交易停止：到期日东部时间下午 4:00
• 买方行权通知截止：到期日东部时间下午 5:30

| 情形 | 目的 | 操作 |
|------|------|------|
| 持有多头股票（Long Stock）| 保护下行风险 | 买入 Put（Protective Put）|
| 持有空头股票（Short Stock）| 保护上行风险 | 买入 Call（Protective Call）|

══════ 备兑看涨（Covered Call）══════

• 持有股票 + 卖出 Call = 备兑看涨
• 目的：产生额外收入（权利金）
• 风险：若股价大幅上涨，上行收益被封顶（Capped）
• 若被行权：以执行价卖出股票（可能比市价低）
• 无需保证金账户（因为已持有底层股票）

══════ 裸空看涨（Uncovered/Naked Call）══════

• 不持有股票，直接卖出 Call

• 必须在**保证金账户**中操作

✦ Long Call：无限收益，亏损限于权利金
✦ Naked Short Call：收益限于权利金，亏损无限（最危险）
✦ 美式期权：任何时间行权（股权期权）；欧式：仅到期日（指数）
✦ 指数期权：现金结算
✦ OCC保证所有上市期权；结算T+1
✦ ODD=期权披露文件，开户前必须提供，OCC制作
✦ 备兑Call=持股+卖Call，产生收入，上行封顶
✦ 裸空Call=无股票+卖Call，无限亏损，需保证金账户

══════ 市场结构 ══════

📄 原文：The primary market is where new securities are first sold to investors; the secondary market is where existing securities are traded.

【考点解析】

一级市场（Primary Market）：
• 新证券首次发行（IPO 或增发）
• 发行方从中筹集资金
• 需要注册（豁免证券除外）

二级市场（Secondary Market）：
• 已发行证券在投资者之间交易
• 发行方不获得资金
• 分为：交易所市场、场外市场（OTC）

══════ 交易所 vs OTC ══════

| 项目 | 交易所（如 NYSE）| OTC / NASDAQ |
|------|----------------|--------------|
| 交易方式 | 拍卖市场（Auction Market）| 经销商市场（Dealer Market）|
| 做市商 | 指定做市商（DMM）| 多个做市商竞争 |
| 定价 | 出价/叫价竞价 | 双边报价（Bid/Ask）|
| 上市要求 | 严格 | 相对宽松 |
| 代表 | NYSE | NASDAQ |

第三市场（Third Market）：在场外交易上市股票
第四市场（Fourth Market）：机构之间直接交易（ECN）

══════ 市场参与者 ══════

经纪商（Broker）：代客户交易，收佣金（代理身份）
自营商（Dealer）：以自有资金买卖，赚取价差（主体身份）
经纪商-自营商（Broker-Dealer）：两种身份均可，但一笔交易中只能有一种

⚠️ 考试提示：同一笔交易中，BD不能既作经纪商又作自营商

══════ 证券分析方法 ══════

基本面分析（Fundamental Analysis）：
• 分析公司财务状况、行业前景、经济环境
• 目标：评估证券内在价值（Intrinsic Value）
• 使用：P/E 比率、EPS、股息收益率等财务指标

技术分析（Technical Analysis）：
• 研究历史价格和成交量图表
• 假设：所有信息已反映在价格中；历史走势会重复
• 使用：趋势线、支撑/阻力位、移动平均线

有效市场假说（Efficient Market Hypothesis）：
• 弱式：价格已反映历史信息→技术分析无效
• 半强式：价格已反映所有公开信息→基本面分析无效
• 强式：价格已反映所有信息（含内幕）→无人能持续跑赢市场

══════ 常用财务比率 ══════

| 比率 | 公式 | 用途 |
|------|------|------|
| P/E（市盈率）| 股价 ÷ 每股收益 | 估值高低 |
| EPS（每股收益）| 净利润 ÷ 流通股数 | 盈利能力 |
| 股息收益率 | 年股息 ÷ 股价 | 现金回报 |
| 流动比率 | 流动资产 ÷ 流动负债 | 短期偿债能力 |
| 债务权益比 | 总债务 ÷ 股东权益 | 财务杠杆 |

══════ 投资风险类型 ══════

系统性风险（Systematic / Market Risk）：影响整个市场，无法通过分散消除

非系统性风险（Unsystematic / Specific Risk）：只影响特定公司/行业，可通过分散消除
• 经营风险（Business Risk）、财务风险（Financial Risk）

分散化（Diversification）：通过持有不相关资产组合降低非系统性风险
Beta（β）：衡量个股相对市场的波动程度
• β=1：与市场同步；β>1：波动大于市场；β<1：波动小于市场

━━ 速记 ━━
✦ 一级市场=新发行，发行方获资金；二级市场=已发行证券交易
✦ NYSE=拍卖市场；NASDAQ=经销商市场（多个做市商）
✦ 同一笔交易BD只能为一种身份（经纪商或自营商）
✦ 基本面=内在价值；技术面=价格图表

📄 原文：Account ownership determines how assets are controlled, transferred, and distributed upon death.

个人账户（Individual Account）：单一账户持有人，完全控制权

联名账户（Joint Account）：
| 类型 | 全称 | 继承方式 |
|------|------|---------|
| JTWROS | 生存者取得权联名 | 一方死亡→另一方自动继承全部 |
| TIC | 按份额共有 | 一方死亡→份额进入遗产（按遗嘱分配）|

未成年人账户（Custodial Account）：
• UGMA（统一未成年人赠与法案）：现金和证券
• UTMA（统一转让给未成年人法案）：更广泛资产（房产等）
• 监护人（Custodian）控制账户；不可撤销赠与
• 成年（18或21岁，各州不同）后移交未成年人
• 每个账户只有一个监护人和一个未成年人

法人/合伙账户：需提供公司决议或合伙协议

══════ 新账户开设要求 ══════

📄 原文：FINRA requires firms to obtain essential information from customers before opening accounts.

【考点解析】

必须获取的信息（"Know Your Customer" / KYC）：
• 姓名、地址（必须）
• 社会安全号码/税号（必须）
• 出生日期（必须）
• 投资目标、财务状况、风险承受能力
• 职业信息（尤其是证券行业从业者）

不必须但建议获取：
• 年收入、净资产
• 投资经验

⚠️ 考试提示：地址和名称是开户最基本要求；投资目标必须记录（适配性要求）

══════ 保证金账户（Margin Account）══════

📄 原文：In a margin account, the broker-dealer lends customers money to purchase securities; Reg T sets the initial margin at 50%.

【考点解析】

法规T（Regulation T）：
• 联邦储备委员会（FRB）制定
• 初始保证金（Initial Margin）= 50%（即买$10,000证券，客户出$5,000）
• 最低维持保证金（Maintenance Margin）= 25%（FINRA规定）

追加保证金通知（Margin Call）：
• 当账户权益跌破维持保证金比例时触发
• 客户必须存入资金或被强制平仓

担保协议（Hypothecation Agreement）：
• 客户授权BD以其证券作为贷款抵押
• 再质押（Rehypothecation）：BD可将客户证券转质押给银行借款
• BD最多可再质押客户保证金债务的 140%

关键术语：
• 借贷价值（Loan Value）= 50%（购买股票）
• 长边权益（Long Market Value）− 贷款余额 = 账户权益（Equity）

══════ SIPC 保护 ══════

• SIPC（证券投资者保护公司）：保护客户免受BD倒闭风险
• 保护上限：每个账户 $500,000，其中现金部分最高 $250,000

| 有限授权 | 只能进行特定操作（如仅限买入）|

全权委托账户：
• 必须有书面授权（Power of Attorney）
• 每笔交易后主管必须审查（Prompt Supervision）
• 不得过度交易（Churning）

━━ 速记 ━━
✦ JTWROS：一方死亡→另一方自动继承全部
✦ TIC：一方死亡→份额进入遗产（按遗嘱）
✦ UGMA/UTMA：不可撤销；成年后移交；一账户一监护人

══════ 订单类型 ══════

📄 原文：Different order types give investors varying degrees of price and execution certainty.

【考点解析】

| 订单类型 | 特征 | 优先级 |
|---------|------|-------|
| 市价单（Market Order）| 立即以最佳可用价格成交 | 执行速度最快，价格不确定 |
| 限价单（Limit Order）| 指定最低卖出价/最高买入价，不一定成交 | 价格确定，执行不确定 |
| 止损单（Stop Order）| 到达触发价后变为市价单 | 用于限制亏损或锁定利润 |
| 止损限价单（Stop-Limit）| 到达触发价后变为限价单 | 价格控制，但可能不成交 |

止损单详解：
• 卖出止损（Sell Stop）：持有多头→止损价低于市价→触发时卖出（防亏损扩大）
• 买入止损（Buy Stop）：持有空头→止损价高于市价→触发时买入（防空头亏损）

⚠️ 考试提示：止损单触发后变为市价单（可能以更差价格成交）；止损限价单有价格保护但可能不成交

| 类型 | 说明 |
|------|------|
| 当日有效（Day Order）| 当天结束时自动取消（默认）|
| 长期有效（GTC – Good Till Cancelled）| 直到执行或手动取消 |
| 立即全部成交或取消（FOK）| 立即全部成交，否则全部取消 |
| 立即成交或取消（IOC）| 立即部分或全部成交，未成交部分取消 |
| 开盘单（MOO）| 在开盘时以开盘价执行 |
| 收盘单（MOC）| 在收盘时以收盘价（或接近）执行 |

📄 原文：Settlement occurs when the buyer pays and the seller delivers securities.

【考点解析】

| 证券类型 | 结算周期 |
|---------|---------|
| 股票（Equities）| T+1（2024年起）|
| 企业债券 | T+1 |
| 市政债券 | T+1 |
| 美国国债 | T+1 |
| 共同基金 | T+1 |
| 期权 | T+1 |
| 政府机构证券 | T+1 |

新股发行流程：

══════ 过度交易（Churning）══════

• 在全权委托账户中过度交易以赚取佣金
• 判断标准：交易频率与客户投资目标是否相符
• 违反适配性和最佳利益原则

══════ 欺诈与不当销售行为 ══════

| 行为 | 说明 |
|------|------|
| 未经授权交易（Unauthorized Trading）| 未获客户许可即进行交易 |
| 挪用客户资金（Misappropriation）| 将客户资金据为己用 |
| 虚假陈述（Misrepresentation）| 提供虚假或误导性信息 |
| 遗漏重要信息（Omission of Material Facts）| 故意隐瞒重要信息 |
| 保证收益（Guaranteeing Returns）| 承诺一定收益或无风险 |
| 混同（Commingling）| 将客户资金与公司资金混在一起 |
| 抢先交易（Front-Running）| 在执行客户大单前，先为自己或他人下单获利 |
| 保留热销新股（Free-Riding / Withholding）| BD成员保留热销新股自用，不对客户发售 |

══════ 反洗钱（AML）规定 ══════

📄 原文：The Bank Secrecy Act requires financial institutions to assist government agencies in detecting and preventing money laundering.

【考点解析】

洗钱三阶段：
1. 置入（Placement）：将现金放入金融系统
2. 分层（Layering）：通过复杂交易掩盖来源
3. 融合（Integration）：洗净资金重新进入合法经济

必须申报的报告：
| 报告类型 | 触发条件 |
|---------|---------|
| CTR（货币交易报告）| 单日现金交易超过 $10,000（必须申报，无论是否可疑）|
| SAR（可疑活动报告）| 可疑交易（无金额下限）；交易后30天内提交；60天内若需调查 |

⚠️ 考试提示：
• CTR = 超过$10,000现金；SAR = 可疑（无下限）
• 提交SAR后**不得通知**当事人（Tipping Off 违法）
• 结构化拆单（Structuring）= 故意将交易拆小以躲避CTR → 本身即违法

AML 计划要求（BD 必须建立）：
• 书面AML政策和程序
• 指定AML合规官（Compliance Officer）
• 员工培训
• 独立审计/测试

══════ 个人礼品与其他规定 ══════

• 礼品限额：每人每年 $100（非现金）
• 现金礼品：任何金额均禁止
• 合规监管：所有员工通讯须按规定保留（电子邮件保存3年）
• 电话录音：交易相关通话须保留

━━ 速记 ━━
✦ 内幕交易 = 重大非公开信息；提供者和接收者均违法
✦ 最高刑事处罚：个人$5M/20年；公司$25M
✦ 抢先交易（Front-Running）= 在客户大单前先下自己的单
✦ 洗钱三阶段：置入→分层→融合
✦ CTR = 现金超$10,000（无论是否可疑）
✦ SAR = 可疑活动（无金额下限）；提交后不得通知当事人
✦ 结构化拆单（Structuring）本身违法
✦ 礼品上限：$100/人/年；现金礼品任何金额均禁止
✦ 保证收益、未授权交易、混同资金均为重大违规`,

所在考纲：Section 2 – Understanding Products and Their Risks
本章预计题量：约 4–6 题

══════ 一、资本利得与资本损失（Capital Gains & Losses）══════

📄 原文：
"A capital gain occurs when an investor sells a security for more than its cost basis. A capital loss occurs when an investor sells a security for less than its cost basis."

【考点解析】
▸ 短期资本利得（Short-Term Capital Gain）：
  • 持有期 ≤ 12个月
  • 按普通所得税率（Ordinary Income Tax Rate）征税
  • 与工资、利息等合并计算

▸ 长期资本利得（Long-Term Capital Gain）：
  • 持有期 > 12个月
  • 享受优惠税率：0% / 15% / 20%（按收入水平适用）
  • 显著低于普通所得税率

▸ 资本损失（Capital Loss）处理规则：
  • 可用于抵消资本利得
  • 超出利得部分：每年最多可抵消 $3,000 普通收入
  • 超额部分：结转至下一年使用（无限期结转）

▸ 净资本利得计算：
  短期利得/损失 → 短期净额
  长期利得/损失 → 长期净额
  两者合并后确定最终税率

⚠️ 考试提示：持有期刚满12个月算短期；超过12个月才算长期

══════ 二、成本基准（Cost Basis）══════

📄 原文：
"The cost basis of a security is the original value of an asset for tax purposes, adjusted for stock splits, dividends, and capital distributions."

【考点解析】
▸ 成本基准 = 买入价格 + 佣金和手续费

▸ 常见计算方法（多只股票时）：
  | 方法 | 说明 |
  |------|------|
  | FIFO（先进先出）| 假设最先买入的股票最先卖出；默认方法 |
  | 特定股份确认（Specific Identification）| 指定卖出哪批股票；最灵活 |
  | 平均成本法（Average Cost）| 所有股票成本取平均；仅适用于共同基金 |

▸ 特殊情形：
  • 继承获得的证券（Inherited Securities）：
    成本基准 = 继承人死亡当日的公平市场价值（Step-Up in Basis）
    持有期视为长期（无论实际持有多久）
  • 赠予获得的证券（Gifted Securities）：
    成本基准 = 赠予方的原始成本
    持有期 = 赠予方的持有期

⚠️ 考试提示：继承证券自动获得"升基"（Step-Up in Basis），且一律视为长期

══════ 三、洗售规则（Wash Sale Rule）══════

📄 原文：
"The wash sale rule prohibits investors from claiming a loss on the sale of a security if they purchase the same or substantially identical security within 30 days before or after the sale."

【考点解析】
▸ 核心规则：
  • 在出售日前后各30天（共61天窗口期）内
  • 买入相同或实质相同的证券
  • 则不得申报该笔亏损（损失被"冻结"）

▸ 被冻结的损失处理：
  • 加入新买入证券的成本基准
  • 持有期同样延续

▸ 洗售规则示例：
  1月1日 买入100股 @ $50
  3月1日 卖出100股 @ $40（亏损 $1,000）
  3月15日 买回100股 @ $42
  → 无法申报 $1,000 损失；成本基准调整为 $42 + $10 = $52

▸ 不适用场景：
  • 在不同账户（如IRA与应税账户）间操作也可能触发洗售规则
  • 指数基金 vs 不同指数基金通常不构成"实质相同"

⚠️ 考试提示：61天窗口（前30+卖出日+后30）；损失不消失而是加入成本基准

══════ 四、股息税务处理══════

📄 原文：
"Qualified dividends are taxed at the lower long-term capital gains tax rates. Non-qualified (ordinary) dividends are taxed at ordinary income tax rates."

【考点解析】
▸ 合格股息（Qualified Dividends）：
  条件：① 来自美国公司或合格外国公司
        ② 股票持有期满足：普通股在除息日前后60天内至少持有61天
  税率：适用长期资本利得率（0% / 15% / 20%）

▸ 普通股息（Ordinary Dividends）：
  • 按普通所得税率征税
  • 包括：货币市场基金利息、短期持有股票股息、REIT股息（大部分）

▸ 股息再投资计划（DRIP）：
  • 自动将股息再投资买入更多股份
  • 即使不收现金，股息仍需当年纳税
  • 每次再投资的价格成为该批股票的新成本基准

⚠️ 考试提示：REIT股息通常为普通股息（非合格股息）

══════ 五、利息收入税务══════

【考点解析】
| 证券类型 | 联邦税 | 州/地方税 |
|---------|--------|-----------|
| 企业债利息 | 普通收入税 | 应税 |
| 美国国债利息 | 普通收入税 | 免税 |
| 市政债利息 | 免税 | 视情况（本州通常免）|
| 领土债券利息 | 免税 | 免税（三重免税）|
| 零息债券OID | 年度纳税（幻影收入）| 视类型 |

▸ OID（原始发行折价 / Original Issue Discount）：
  • 零息债券等以折价发行的债券
  • 虽然不支付现金，每年仍需就折价摊销部分纳税
  • 企业零息债：联邦+州均应税
  • 国债STRIPS：联邦应税，免州税
  • 市政零息债：免联邦税

══════ 六、税收优惠账户（Tax-Advantaged Accounts）══════

【考点解析】
▸ 传统IRA（Traditional IRA）：
  • 税前供款（满足条件可抵税）
  • 账户内增长：税收递延（Tax-Deferred）
  • 提款：按普通收入税率纳税
  • 59½岁前提款：额外10%罚税
  • 73岁起须开始最低分配（RMD）
  • 年度供款上限：$7,000（2024年，50岁以上+$1,000追加）

▸ Roth IRA：
  • 税后供款（不可抵税）
  • 账户内增长：免税（Tax-Free）
  • 合格提款：完全免税
  • 无RMD要求
  • 收入限制：高收入者不可供款
  • 59½岁前且开户满5年：合格提款才免税

▸ 401(k) / 403(b)：
  • 雇主赞助计划；税前供款
  • 税收递延增长；提款时纳税
  • 供款上限更高：$23,000（2024年）
  • 59½岁前提款：10%罚税+普通收入税
  • 73岁起须RMD

▸ 529教育储蓄计划：
  • 税后供款；联邦层面无抵税
  • 合规教育用途提款：完全免税
  • 非教育用途提款：罚税10%+纳税

| 账户类型 | 供款税务 | 增长 | 提款 | RMD |
|---------|--------|------|------|-----|
| 传统IRA | 可抵税 | 递延 | 应税 | 73岁起有 |
| Roth IRA | 税后 | 免税 | 免税 | 无 |
| 401(k) | 税前 | 递延 | 应税 | 73岁起有 |
| 529 | 税后 | 免税 | 教育用途免税 | 无 |

⚠️ 考试提示：Roth IRA：供款税后、提款免税、无RMD——与传统IRA完全相反

══════ 七、税收损失收割（Tax-Loss Harvesting）══════

【考点解析】
▸ 定义：在年末卖出亏损证券，将损失"实现"以抵消当年资本利得
▸ 好处：降低当年应税所得
▸ 注意：须遵守洗售规则（不能在30天内买回相同证券）
▸ 常见策略：卖出亏损股票，买入相似但非"实质相同"的基金

══════ 八、不同产品税务对比速查══════

| 产品 | 利息/股息 | 资本利得 |
|------|---------|--------|
| 股票 | 合格股息（优惠率）| 短期/长期 |
| 企业债 | 普通收入 | 短期/长期 |
| 市政债 | 联邦免税 | 应税 |
| 国债 | 联邦应税，免州税 | 应税 |
| 共同基金 | 视底层资产 | 分配时应税 |
| ETF | 视底层资产 | 比共同基金更省税 |
| REITs | 大部分为普通股息 | 短期/长期 |

━━ 速记 ━━
✦ 短期资本利得（≤12月）= 普通税率；长期（>12月）= 优惠率
✦ 洗售规则：前后30天内买回同类证券 → 不得申报亏损
✦ 继承证券：Step-Up in Basis（升基）+ 自动视为长期
✦ FIFO = 默认成本基准方法；平均成本法仅用于共同基金
✦ 合格股息：适用长期资本利得税率（比普通税率低）
✦ 零息债券：每年须就OID（幻影收入）纳税，即使没有收到现金
✦ 传统IRA：递延纳税；Roth IRA：免税增长+免税提款
✦ 401(k)/IRA提前（59½前）提款：10%罚税
✦ 73岁起：传统IRA和401(k)均须开始最低分配（RMD）
✦ 市政债：联邦免税；本州债券额外免州/地方税（三重免税）`
};

let kbChapter = 1, kbFilter = 'all';

async function saveChapterNote(chapterNum, content, isPublic) {
  const { data, error } = await sb.from('chapter_notes').insert({
    chapter_num: chapterNum,
    username: currentUser,
    content,
    is_public: isPublic,
    created_at: new Date().toISOString()
  }).select().single();
  if (!error && data) DB.chapterNotes.push(data);
  return !error;
}

function renderKnowledge() {
  const chapNotes = DB.chapterNotes.filter(n => {
    if (n.chapter_num !== kbChapter) return false;
    if (kbFilter === 'mine') return n.username === currentUser;
    return n.is_public || n.username === currentUser;
  });

  const pills = Array.from({length: TOTAL_CHAPTERS}, (_, i) => {
    const n = i + 1;
    return `<div class="ch-pill ${n === kbChapter ? 'active' : ''}" onclick="setKbChapter(${n})">第${n}章</div>`;
  }).join('');

  const officialNote = OFFICIAL_NOTES[kbChapter];
  const officialSection = `<div class="official-box">
    <div class="official-label">📋 官方精读</div>
    <div class="official-body">${officialNote ? renderOfficial(officialNote) : '<span style="color:var(--text3);font-style:italic;">本章官方精读内容尚未录入，敬请期待。</span>'}</div>
  </div>`;

  const noteCards = chapNotes.length === 0
    ? '<div class="empty-state">暂无笔记，成为第一个分享学习心得的人吧！</div>'
    : chapNotes.map(n => {
        const author = USERS[n.username]?.name || n.username;
        const isOwn = n.username === currentUser;
        const dt = new Date(n.created_at);
        const dtStr = `${dt.getMonth()+1}月${dt.getDate()}日`;
        return `<div class="note-card">
          <div class="note-meta">
            <span class="note-author">${esc(author)}</span>
            <div class="note-badges">
              ${!n.is_public && isOwn ? '<span class="badge badge-amber">🔒 私密</span>' : '<span class="badge badge-green">公开</span>'}
              <span style="font-family:var(--mono);font-size:10px;color:var(--text3);">${dtStr}</span>
            </div>
          </div>
          <div class="note-body">${esc(n.content)}</div>
        </div>`;
      }).join('');

  const addForm = `<div class="note-add-form">
    <div style="font-size:13px;font-weight:500;margin-bottom:8px;">添加笔记</div>
    <textarea class="form-textarea" id="kb-note-input" style="min-height:80px;" placeholder="分享你对第 ${kbChapter} 章的学习笔记、重点或心得…"></textarea>
    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:8px;">
      <label class="privacy-toggle">
        <input type="checkbox" id="kb-note-public" checked>
        <span style="font-size:12px;color:var(--text2);">公开（所有人可见）</span>
      </label>
      <button class="btn btn-primary" style="padding:7px 16px;" onclick="submitNote()">发布笔记</button>
    </div>
  </div>`;

  document.getElementById('view-knowledge').innerHTML = `
    <div class="page-header">
      <div class="page-title">知识库</div>
      <div class="page-sub">官方精读 + 学员笔记 · 共 ${TOTAL_CHAPTERS} 章</div>
    </div>
    <div class="card" style="margin-bottom:12px;">
      <div class="section-hdr">选择章节</div>
      <div class="ch-pills">${pills}</div>
    </div>
    <div class="card" style="margin-bottom:12px;">${officialSection}</div>
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
        <div class="section-hdr" style="margin-bottom:0;">学员笔记 <span class="sec-count">${chapNotes.length}</span></div>
        <div class="filter-pills">
          <div class="filter-pill ${kbFilter==='all'?'active':''}" onclick="setKbFilter('all')">全部公开</div>
          <div class="filter-pill ${kbFilter==='mine'?'active':''}" onclick="setKbFilter('mine')">只看我的</div>
        </div>
      </div>
      ${noteCards}
      ${addForm}
    </div>`;
}

function setKbChapter(n) { kbChapter = n; renderKnowledge(); }
function setKbFilter(f) { kbFilter = f; renderKnowledge(); }

async function submitNote() {
  const content = document.getElementById('kb-note-input').value.trim();
  if (!content) { showToast('请填写笔记内容'); return; }
  if (content.length < 5) { showToast('笔记内容太简短'); return; }
  const isPublic = document.getElementById('kb-note-public').checked;
  const btn = document.querySelector('#view-knowledge .btn-primary');
  if (btn) btn.disabled = true;
  const ok = await saveChapterNote(kbChapter, content, isPublic);
  if (ok) { showToast('笔记已发布 ✓'); renderKnowledge(); }
  else { showToast('发布失败，请重试'); if (btn) btn.disabled = false; }
}

function handleLogin() {
  const sel = document.getElementById('login-select').value;
  if (!sel) { showToast('请选择账号'); return; }
  localStorage.setItem('sie_user', sel);
  currentUser = sel;
  startApp(sel);
}

function handleLogout() {
  localStorage.removeItem('sie_user');
  currentUser = null;
  document.getElementById('app-screen').classList.add('hidden');
  document.getElementById('login-screen').style.display = 'flex';
}

function startApp(username) {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').classList.remove('hidden');
  getProgress(username); // ensure initialized
  renderSidebar(username);
  switchView(USERS[username].isAdmin ? 'admin' : 'dashboard');
}

async function init() {
  await loadAllData();
  document.getElementById('loading-overlay').classList.add('hidden');
  const saved = localStorage.getItem('sie_user');
  if (saved && USERS[saved]) { currentUser = saved; startApp(saved); }
}

init();
