name: Daily Morning Reminder

on:
  schedule:
    - cron: '0 1 * * *'   # 09:00 Malaysia (UTC+8)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python .github/scripts/notify.py daily-reminder ${{ secrets.SUPABASE_ANON_KEY }}
