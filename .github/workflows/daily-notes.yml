name: Daily Notes Push

on:
  schedule:
    - cron: '0 2 * * 1-5'   # 10:00 Malaysia (UTC+8), weekdays only
  workflow_dispatch:
    inputs:
      chapter:
        description: 'Override chapter number (1-20), leave blank for today'
        required: false
        default: ''

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.chapter }}" ]; then
            EXTRA="--chapter=${{ github.event.inputs.chapter }}"
          fi
          python .github/scripts/notify.py daily-notes ${{ secrets.SUPABASE_ANON_KEY }} $EXTRA
